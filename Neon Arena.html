<style>
:root{--c1:#19e6ff;--c2:#ff2bd6;--c3:#ffe600;--bg:#070714;--tx:#e8f6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#05050f;color:var(--tx);font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;touch-action:none}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
#ui.dim{background:rgba(3,3,14,.72);backdrop-filter:blur(3px)}
#ui.hidden{display:none}
.panel{max-width:min(1000px,98vw);max-height:96vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 18px;border:2px solid var(--c1);border-radius:16px;background:rgba(8,6,28,.9);box-shadow:0 0 18px var(--c1),inset 0 0 22px rgba(25,230,255,.14);text-align:center}
.panel::-webkit-scrollbar{width:8px}.panel::-webkit-scrollbar-thumb{background:var(--c1);border-radius:8px}
.title{font-size:clamp(34px,9vw,92px);font-weight:900;letter-spacing:.05em;margin:0;line-height:1;color:#fff;text-shadow:0 0 6px #fff,0 0 14px var(--c1),0 0 34px var(--c1),0 0 60px var(--c2);animation:fl 3s infinite}
.title span{color:var(--c2);text-shadow:0 0 6px #fff,0 0 14px var(--c2),0 0 34px var(--c2)}
@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.7}96%{opacity:1}98%{opacity:.8}}
h2{margin:4px 0 10px;font-size:clamp(20px,4vw,34px);color:#fff;text-shadow:0 0 10px var(--c1),0 0 22px var(--c1);letter-spacing:.04em}
h3{margin:10px 0 6px;font-size:16px;color:var(--c3);text-shadow:0 0 8px var(--c3)}
.sub{opacity:.8;font-size:14px;margin:6px 0}
.btn{display:inline-block;margin:5px;padding:11px 22px;font:700 clamp(14px,2.4vw,18px) inherit;font-family:inherit;color:#fff;background:linear-gradient(180deg,rgba(25,230,255,.22),rgba(25,230,255,.05));border:2px solid var(--c1);border-radius:12px;cursor:pointer;text-shadow:0 0 8px var(--c1);box-shadow:0 0 10px rgba(25,230,255,.55);transition:transform .1s,box-shadow .15s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 22px var(--c1)}
.btn:active{transform:scale(.97)}
.btn.big{font-size:clamp(20px,4vw,30px);padding:14px 52px;border-color:var(--c2);text-shadow:0 0 10px var(--c2);box-shadow:0 0 16px var(--c2);background:linear-gradient(180deg,rgba(255,43,214,.3),rgba(255,43,214,.06))}
.btn.sm{padding:6px 12px;font-size:14px;margin:2px}
.btn.on{background:var(--c1);color:#001018;text-shadow:none}
.btn.dis,.btn[disabled]{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:6px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:8px 0}
.card{position:relative;border:2px solid #3a4a7a;border-radius:12px;padding:10px;background:rgba(15,15,45,.8);cursor:pointer;transition:.15s;text-align:center}
.card:hover{border-color:var(--c1);box-shadow:0 0 16px var(--c1);transform:translateY(-3px)}
.card.sel{border-color:var(--c2);box-shadow:0 0 18px var(--c2)}
.card.locked{opacity:.4;filter:grayscale(1);pointer-events:none}
.card .nm{font-weight:800;margin-top:4px}
.card .ds{font-size:12px;opacity:.75}
.card canvas{width:100%;height:auto;border-radius:8px;display:block}
.stg{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;margin:4px;border-radius:50%;border:2px solid var(--c1);font-weight:900;cursor:pointer;background:rgba(25,230,255,.1)}
.stg.boss{border-color:var(--c2);color:var(--c2);box-shadow:0 0 12px var(--c2)}
.stg.done{background:var(--c1);color:#001018}
.stg.lock{opacity:.3;pointer-events:none}
.stg:hover{transform:scale(1.12);box-shadow:0 0 16px #fff}
.sl{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 56px;gap:8px;align-items:center;margin:5px 0;text-align:left;font-size:14px}
.sl output{text-align:right;color:var(--c3);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:#22305a;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--c1);box-shadow:0 0 10px var(--c1);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--c1);box-shadow:0 0 10px var(--c1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}

.kb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;border:1px solid #2a3a6a;border-radius:8px;margin:3px 0;font-size:14px}

.skl{text-align:left;font-size:13px;margin:3px 0;padding:5px 8px;border-left:3px solid var(--c2);background:rgba(255,255,255,.04)}
.bar{height:8px;border-radius:6px;background:#1a2146;overflow:hidden;margin:2px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.help{text-align:left;font-size:14px;line-height:1.55}.help b{color:var(--c3)}
.big-score{font-size:clamp(28px,6vw,52px);font-weight:900;color:var(--c3);text-shadow:0 0 14px var(--c3)}
.hudbtn{position:absolute;top:8px;width:42px;height:42px;border-radius:50%;border:2px solid var(--c1);background:rgba(5,10,30,.6);color:#fff;font-size:16px;cursor:pointer;z-index:6;box-shadow:0 0 10px var(--c1)}
#pauseBtn{right:8px;display:none}#muteBtn{right:58px;display:none}
#touch{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
#touch .el{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none}
#tj{border-radius:50%;border:3px solid rgba(25,230,255,.7);background:radial-gradient(circle,rgba(25,230,255,.12),rgba(25,230,255,.03));box-shadow:0 0 14px rgba(25,230,255,.6),inset 0 0 14px rgba(25,230,255,.25)}
#tk{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff,var(--c1));box-shadow:0 0 16px var(--c1);pointer-events:none}
.tb{border-radius:50%;border:3px solid var(--c2);background:rgba(255,43,214,.14);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px var(--c2),inset 0 0 12px rgba(255,43,214,.3);overflow:hidden;font-size:15px;text-shadow:0 0 8px var(--c2)}
.tb.jp{border-color:var(--c3);box-shadow:0 0 14px var(--c3);background:rgba(255,230,0,.12)}
.tb.sk{border-color:var(--c1);box-shadow:0 0 14px var(--c1);background:rgba(25,230,255,.12);font-size:20px}
.tb.act{filter:brightness(2)}
.tb .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.65);pointer-events:none}
.tb b{position:relative;z-index:1;pointer-events:none}
#touch.edit .el{outline:2px dashed #fff;cursor:grab}
#touch.edit .el.pick{outline:3px solid var(--c3)}
#editbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:9;display:none;padding:8px 12px;border:2px solid var(--c1);border-radius:12px;background:rgba(5,8,28,.92);text-align:center;max-width:96vw}
#editbar .sl{grid-template-columns:90px 1fr 46px;margin:2px 0}
#rot{position:absolute;inset:0;display:none;z-index:20;background:#05050f;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px;color:var(--c1)}
@media(orientation:portrait){body.tplay #rot{display:flex}}
</style>
</head>

<div id="app">
<canvas id="cv"></canvas>
<div id="touch">
 <div class="el" id="tj" data-id="joy"><div id="tk"></div></div>

 <div class="el tb jp" data-id="jump" data-k="jump"><b>NHẢY</b><i class="cd"></i></div>
 <div class="el tb sk" data-id="s1" data-k="s1"><b>1</b><i class="cd"></i></div>
 <div class="el tb sk" data-id="s2" data-k="s2"><b>2</b><i class="cd"></i></div>
 <div class="el tb sk" data-id="s3" data-k="s3"><b>3</b><i class="cd"></i></div>
</div>

<button id="pauseBtn" class="hudbtn">❚❚</button>

<div id="ui"></div>

const sgn=v=>v<0?-1:1;
function srand(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;}}

function mergeDeep(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object')mergeDeep(t[k],s[k]);else t[k]=s[k];}}
function loadSave(){let d=null;try{d=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
 const b={high:0,prog:Array(10).fill(0),set:JSON.parse(JSON.stringify(DEFSET))};
 if(d&&typeof d==='object'){b.high=+d.high||0;if(Array.isArray(d.prog))for(let i=0;i<10;i++)b.prog[i]=+d.prog[i]||0;if(d.set&&typeof d.set==='object')mergeDeep(b.set,d.set);}
 return b;}
let S=loadSave();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}

/* ===== Âm thanh (Web Audio) ===== */
let AC=null,master=null,noiseBuf=null;const lastSfx={};
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);setVol();}catch(e){AC=null}}
function setVol(){if(master)master.gain.value=S.set.sound?S.set.vol*.5:0;}
function tone(type,f0,f1,dur,vol=.3,delay=0){if(!AC||!S.set.sound)return;const t=AC.currentTime+delay;
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
 o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);
 g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol=.3,hp=800){if(!AC||!S.set.sound)return;
 if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}
const SFX={
 jump:()=>tone('square',300,700,.14,.12),
 atk:()=>{noise(.08,.15,2000);tone('sawtooth',500,200,.08,.08)},
 hit:()=>{noise(.1,.2,1200);tone('square',200,80,.1,.12)},
 skill:()=>{tone('sawtooth',200,900,.25,.15);tone('square',400,1200,.2,.08,.05)},
 shoot:()=>tone('square',900,300,.1,.07),
 hurt:()=>{tone('sawtooth',300,60,.3,.25);noise(.15,.2,500)},
 die:()=>{tone('sawtooth',400,40,.6,.25);noise(.4,.25,300)},
 pick:()=>{tone('triangle',600,1200,.12,.2);tone('triangle',900,1800,.15,.2,.08)},
 boom:()=>{noise(.5,.4,100);tone('sine',120,30,.5,.4)},
 win:()=>{[523,659,784,1047].forEach((f,i)=>tone('square',f,f,.2,.15,i*.12))},
 lose:()=>{[400,330,260,180].forEach((f,i)=>tone('sawtooth',f,f*.9,.3,.18,i*.18))},
 click:()=>tone('square',700,900,.05,.1),
 boss:()=>{tone('sawtooth',90,50,.8,.3);tone('square',60,40,.8,.2)},
 spring:()=>tone('sine',200,900,.25,.2),
 warn:()=>tone('square',500,500,.12,.12)
};
function sfx(n){if(!AC)return;const t=performance.now();if(lastSfx[n]&&t-lastSfx[n]<45)return;lastSfx[n]=t;try{SFX[n]&&SFX[n]();}catch(e){}}

/* ===== Sinh màn chơi (dài hơn, nhiều bẫy) ===== */
function genLevel(mi,si){
 const M=MAPS[mi],isBoss=si===M.stages-1,R=srand(mi*977+si*131+11);
 const L={solids:[],plats:[],springs:[],spikes:[],hz:[],spawns:[],W:0,boss:isBoss,segs:[],sawSegs:[]};
 const mkSeg=(x,w,top)=>{L.solids.push({x,y:top,w,h:VH+400-top});L.segs.push({x,w,top});};
 if(isBoss){
  L.W=1400;mkSeg(0,1400,GY);
  L.plats.push({x:150,y:GY-120,w:190,h:12},{x:1060,y:GY-120,w:190,h:12},{x:600,y:GY-225,w:200,h:12});
  L.springs.push({x:690,y:GY-12,w:44,h:12,a:0});
  return L;
 }
 L.W=4600+si*380+mi*80;
 const lv=si+(mi>>1);
 let x=0,top=GY;
 mkSeg(0,420,GY);x=420;
 const decor=(x,w,top)=>{
  if(w<300)return;
  let spk=false;
  if(R()<.5){const n=1+Math.floor(R()*2);
   for(let k=0;k<n;k++){const px=x+30+R()*(w-250),py=top-(95+R()*45);
    L.plats.push({x:px,y:py,w:120+R()*100,h:12,crumble:R()<.25&&si>=1?1:0,cr:0,off:0});
    if(R()<.4)L.plats.push({x:px+30+R()*70,y:py-88-R()*25,w:110+R()*70,h:12,crumble:0,cr:0,off:0});}}
  if(R()<.16){const sx=x+w*.5;L.springs.push({x:sx,y:top-12,w:44,h:12,a:0});L.plats.push({x:sx-90,y:top-285,w:220,h:12,crumble:0,cr:0,off:0});}
  if(x>700&&R()<.3+Math.min(.25,lv*.04)){const sw=60+R()*50;L.spikes.push({x:x+w*.22,y:top-16,w:sw,h:16});spk=true;}
  if(si>=1&&w>=380&&R()<.3){L.hz.push({k:'jet',x:x+w*.68,y:top,w:34,h:150,per:3.2-Math.min(1,lv*.1),ph:R()*3});spk=true;}
  if(si>=2&&!spk&&w>=420&&R()<.3){L.hz.push({k:'saw',x0:x+50,x1:x+w-50,y:top-26,r:24,sp:1.1+R()*.5,ph:R()*6,cx:x+w/2,top});L.sawSegs.push({x,w});}
 };
 while(x<L.W-560){
  const r=R();
  if(r<.26&&x>600){
   const gap=110+Math.floor(R()*60),t=R();
   if(t<.4)L.plats.push({x:x+gap/2-45,y:top-70,w:90,h:12,mov:1,mx:x+gap/2-45,range:35,sp:1.5,ph:R()*6,dx:0,crumble:0,cr:0,off:0});
   else if(t<.65)L.plats.push({x:x+gap/2-40,y:top-60,w:80,h:12,crumble:1,cr:0,off:0});
   x+=gap;const w=260+Math.floor(R()*220);mkSeg(x,w,top);decor(x,w,top);x+=w;continue;
  }
  let nt=top;const hr=R();if(hr<.3&&top>GY-80)nt=top-40;else if(hr<.5&&top<GY)nt=top+40;
  const w=300+Math.floor(R()*280);top=nt;mkSeg(x,w,top);decor(x,w,top);x+=w;
 }
 mkSeg(x,L.W-x,top);
 const topAt=px=>{for(const s of L.segs)if(px>=s.x+10&&px<=s.x+s.w-10)return s.top;return null;};
 const bad=px=>{for(const sp of L.spikes)if(px>sp.x-34&&px<sp.x+sp.w+34)return true;for(const h of L.hz)if(h.k==='jet'&&Math.abs(px-h.x)<50)return true;for(const s of L.sawSegs)if(px>s.x&&px<s.x+s.w)return true;return false;};
 const pool=['grunt','gunner','flyer','grunt','gunner'];
 const el=si+(mi>=3?1:0)+(mi>=6?1:0);
 if(el>=1)pool.push('charger','bomber');if(el>=2)pool.push('shield','ninja','charger');if(el>=3)pool.push('mage','bomber','shield');
 const n=Math.min(48,16+si*3+mi);
 for(let k=0;k<n;k++){
  let sx=560+(L.W-900)*(k+R()*.8)/n,tp=topAt(sx),g=0;
  while((tp===null||bad(sx))&&g++<60){sx+=20;tp=topAt(sx);}
  if(tp===null||sx>L.W-120)continue;
  const t=pick(pool),el2=si>=2&&R()<.12+si*.03;
  L.spawns.push({t,x:sx,y:t==='flyer'?tp-200:tp,elite:el2});
  if(R()<.18&&t!=='flyer'){const t2=pick(pool);if(t2!=='flyer'&&topAt(sx+60)===tp&&!bad(sx+60))L.spawns.push({t:t2,x:sx+60,y:tp,elite:false});}
 }
 return L;
}

/* ===== Va chạm / vật lý (AABB) ===== */
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function phys(e,dt,L,noGrav){
 if(e.gnd&&e.gnd.dx)e.x+=e.gnd.dx;
 e.hitWall=false;
 e.x+=e.vx*dt;
 for(const s of L.solids){
  if(e.x<s.x+s.w&&e.x+e.w>s.x&&e.y<s.y+s.h&&e.y+e.h>s.y){
   if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;
   else e.x=(e.x+e.w/2<s.x+s.w/2)?s.x-e.w:s.x+s.w;
   e.hitWall=true;
  }
 }
 e.x=clamp(e.x,0,L.W-e.w);
 const py=e.y;
 if(!noGrav)e.vy+=GRAV*dt;
 e.y+=e.vy*dt;e.on=false;e.gnd=null;
 for(const s of L.solids){
  if(e.x<s.x+s.w&&e.x+e.w>s.x&&e.y<s.y+s.h&&e.y+e.h>s.y){
   if(e.vy>=0){e.y=s.y-e.h;e.vy=0;e.on=true;}
   else{e.y=s.y+s.h;e.vy=0;}
  }
 }
 if(e.vy>=0&&!(e.drop>0)){
  for(const p of L.plats){
   if(p.off>0)continue;
   if(e.x+e.w>p.x&&e.x<p.x+p.w){
    const pb=py+e.h,nb=e.y+e.h;
    if(pb<=p.y+1&&nb>=p.y){e.y=p.y-e.h;e.vy=0;e.on=true;e.gnd=p;if(p.crumble&&p.cr<=0&&e===G.P)p.cr=.55;}
   }
  }
 }
}

/* ===== AI kẻ địch thường ===== */
function supportAt(px,feet){
 const L=G.L;
 for(const s of L.solids)if(px>=s.x&&px<=s.x+s.w&&s.y>=feet-60&&s.y<=feet+110)return s.y;
 for(const p of L.plats)if(!(p.off>0)&&px>=p.x&&px<=p.x+p.w&&p.y>=feet-8&&p.y<=feet+110)return p.y;
 return null;
}
function groundAhead(e,dir,look){return supportAt(e.x+e.w/2+dir*(e.w/2+look),e.y+e.h)!==null;}
function gapWidth(e,dir){const cx=e.x+e.w/2,f=e.y+e.h;for(let d=30;d<=260;d+=20)if(supportAt(cx+dir*d,f)!==null)return d;return 999;}
function hazardAhead(e,dir){
 const L=G.L,x0=e.x+e.w/2+dir*(e.w/2+8),x1=x0+dir*64,a=Math.min(x0,x1),b=Math.max(x0,x1);
 for(const s of L.spikes)if(b>s.x&&a<s.x+s.w&&Math.abs(s.y+s.h-(e.y+e.h))<30)return true;
 for(const h of L.hz)if(h.k==='jet'&&b>h.x&&a<h.x+h.w&&Math.abs(h.y-(e.y+e.h))<30&&jetState(h)>0)return true;
 return false;
}
function jetState(h){const t=(G.time+h.ph)%h.per;return t>h.per-.7?(t>h.per-.35?2:1):0;}   // 1=cảnh báo 2=đang phun
function walk(e,dir,spd,chase){
 if(!e.on)return;
 const sp=spd*(e.slow>0?.5:1)*AIb().spd;
 if(!groundAhead(e,dir,20)){
  const gw=gapWidth(e,dir);
  if(chase&&gw<=150&&e.jmp<=0&&Math.abs(G.P.x-e.x)>gw+40){e.vy=-770;e.vx=dir*Math.max(sp*1.4,220);e.on=false;e.jmp=.9;}
  else e.vx=0;
  return;
 }
 if(e.jmp<=0&&hazardAhead(e,dir)){e.vy=-720;e.vx=dir*Math.max(sp,170);e.jmp=.9;e.on=false;return;}
 e.vx=dir*sp;
 if(e.hitWall&&e.jmp<=0){e.vy=-660;e.jmp=.6;}
 for(const o of G.enemies){if(o===e||o.dead||o.fly||o.boss||Math.abs(o.y-e.y)>40)continue;const d=(o.x+o.w/2)-(e.x+e.w/2);
  if(Math.abs(d)<26){e.vx-=sgn(d)*50;}}
}
function lead(sx,sy,spd,P,k){
 const tt=Math.max(.15,Math.hypot(P.x+P.w/2-sx,P.y+P.h/2-sy)/spd);
 const tx=P.x+P.w/2+P.vx*tt*k,ty=P.y+P.h/2+Math.min(0,P.vy)*tt*k*.5;
 const a=Math.atan2(ty-sy,tx-sx);return[Math.cos(a)*spd,Math.sin(a)*spd,tt];
}
function mobSlash(e,w,kb,col){
 addBox({own:'e',x:e.face>0?e.x+e.w-6:e.x-w+6,y:e.y-4,w,h:e.h+8,dmg:e.dmg,life:.12,kb:kb||1,vis:'slash',col:col||MAPS[G.mi].acc,f:e.face});sfx('atk');
}
function mobDodge(e,P,ai){
 if(e.fly||!e.on||e.dodgeT>0||e.st!=='walk')return;
 const d=ai.dodge+(e.t==='ninja'?.3:0);if(d<=0)return;
 const cx=e.x+e.w/2;
 for(const pr of G.projs){
  if(pr.own!=='p'||pr.kind==='wave')continue;
  const dx=cx-pr.x;
  if(Math.abs(dx)<150&&Math.abs(pr.y-(e.y+e.h/2))<70&&Math.sign(dx)===Math.sign(pr.vx)){
   e.dodgeT=1.3;if(Math.random()<d){e.vy=-640;e.on=false;e.jmp=.4;}return;}
 }
 if(P.atkT>.05&&Math.abs(P.x-e.x)<110&&Math.random()<d*.04){e.dodgeT=1.2;e.kb=.16;e.vx=-sgn(P.x-e.x)*300*(groundAhead(e,-sgn(P.x-e.x),30)?1:0);}
}
function groundY(x,f){const s=supportAt(x,f);return s===null?GY:s;}
function updMob(e,dt){
 const p=G.P,L=G.L,ai=AIb(),pc=p.x+p.w/2,ec=e.x+e.w/2,dx=pc-ec,ad=Math.abs(dx);
 e.anim+=dt;e.jmp-=dt;e.dodgeT-=dt;e.slow=Math.max(0,e.slow-dt);
 if(!e.aggro&&ad<820*ai.range&&!p.dead)e.aggro=true;
 e.lean+=((e.on?clamp(e.vx/200,-1,1)*.12:0)-e.lean)*Math.min(1,dt*10);
 if(e.fly)return updFlyer(e,dt,p,ai,pc,ec,dx,ad);
 if(!e.aggro){phys(e,dt,L);if(e.y>VH+100)e.dead=true;return;}
 const frozen=e.stun>0;
 if(frozen||e.kb>0){e.vx*=.9;if(e.kb>0&&e.on&&e.vx&&!groundAhead(e,sgn(e.vx),8))e.vx=0;}
 else{
  e.face=dx>0?1:-1;
  mobDodge(e,p,ai);
  const f=MOB_AI[e.t];if(f)f(e,dt,p,ai,pc,ec,dx,ad);
 }
 phys(e,dt,L);
 if(e.y>VH+100)e.dead=true;
}
const MOB_AI={
 grunt(e,dt,p,ai,pc,ec,dx,ad){
  if(e.st==='walk'){
   walk(e,e.face,e.spd,true);
   if(ad<62&&e.cd<=0&&Math.abs(p.y-e.y)<70&&!p.dead){e.st='wind';e.tm=.45*ai.wind;e.vx=0;e.tele=1;}
  }else if(e.st==='wind'){e.vx=0;if(e.tm<=0){mobSlash(e,64,1);e.st='rec';e.tm=.4;e.vx=e.face*200;e.tele=0;e.combo=(e.combo||0)+1;}}
  else if(e.st==='rec'){e.vx*=.85;if(e.tm<=0){if(ai.ag>1.1&&e.combo<2&&ad<90&&Math.random()<.6){e.st='wind';e.tm=.25;e.tele=1;}else{e.st='walk';e.cd=1.2*ai.cd;e.combo=0;}}}
 },
 gunner(e,dt,p,ai,pc,ec,dx,ad){
  if(e.st==='walk'){
   if(ad<230)walk(e,-e.face,e.spd,false);else if(ad>400*ai.range)walk(e,e.face,e.spd,true);else e.vx=0;
   if(e.cd<=0&&ad<650*ai.range&&!p.dead){e.st='wind';e.tm=.4*ai.wind;e.vx=0;e.tele=1;e.burst=ai.ag>1.15?3:1;}
  }else if(e.st==='wind'){
   e.vx=0;
   if(e.tm<=0){
    const sx=ec+e.face*16,sy=e.y+e.h*.4,v=lead(sx,sy,340,p,ai.aim);
    addProj({own:'e',x:sx,y:sy,vx:v[0],vy:v[1],r:7,dmg:e.dmg,life:3,col:MAPS[G.mi].edge,sty:'bolt'});sfx('shoot');
    e.burst--;if(e.burst>0)e.tm=.14;else{e.st='walk';e.cd=rnd(1.8,2.6)*ai.cd;e.tele=0;}
   }
  }
 },
 charger(e,dt,p,ai,pc,ec,dx,ad){
  if(e.st==='walk'){
   if(ad>330)walk(e,e.face,e.spd,true);else e.vx=0;
   if(e.cd<=0&&ad<520*ai.range&&ad>90&&!p.dead&&Math.abs(p.y-e.y)<90){e.st='wind';e.tm=.65*ai.wind;e.vx=0;e.tele=1;e.cf=e.face;}
  }else if(e.st==='wind'){e.vx=0;e.face=e.cf;if(e.tm<=0){e.st='charge';e.tm=1;e.hitDone=false;e.tele=0;sfx('boss');}}
  else if(e.st==='charge'){
   e.face=e.cf;e.vx=e.cf*540*ai.spd;
   if(!e.hitDone&&ov(e,p)&&!p.dead)e.hitDone=hurtPlayer(e.dmg,ec,1.5)||e.hitDone;
   if(Math.random()<.5)burst(e.x+e.w/2-e.cf*14,e.y+e.h,'#fff',1,60,.3,2);
   if(e.hitWall||!groundAhead(e,e.cf,28)||e.tm<=0){e.vx=0;e.st='rec';e.tm=e.hitWall?1.1:.7;addShake(e.hitWall?6:0);if(e.hitWall)burst(ec+e.cf*16,e.y+e.h/2,'#fff',10,160,.4,3);}
  }else if(e.st==='rec'){e.vx*=.8;e.stunned=1;if(e.tm<=0){e.st='walk';e.cd=2.2*ai.cd;e.stunned=0;}}
 },
 bomber(e,dt,p,ai,pc,ec,dx,ad){
  if(e.st==='walk'){
   if(ad<260)walk(e,-e.face,e.spd,false);else if(ad>440*ai.range)walk(e,e.face,e.spd,true);else e.vx=0;
   if(e.cd<=0&&ad<560*ai.range&&!p.dead){e.st='wind';e.tm=.55*ai.wind;e.vx=0;e.tele=1;}
  }else if(e.st==='wind'){e.vx=0;
   if(e.tm<=0){

    const tx=pc+p.vx*tt*ai.aim,ty=p.y+p.h;
    addProj({own:'e',kind:'bomb',x:sx,y:sy,vx:(tx-sx)/tt,vy:(ty-sy-.5*900*tt*tt)/tt,grav:900,r:9,dmg:e.dmg*.3,life:tt+.2,boom:e.dmg,boomR:78,col:'#ff7a29',sty:'bomb'});sfx('shoot');
    e.st='walk';e.cd=rnd(2.2,3)*ai.cd;e.tele=0;
   }}
 },
 shield(e,dt,p,ai,pc,ec,dx,ad){
  if(e.st==='walk'){
   walk(e,e.face,e.spd,true);
   if(ad<76&&e.cd<=0&&!p.dead&&Math.abs(p.y-e.y)<70){e.st='wind';e.tm=.5*ai.wind;e.vx=0;e.tele=1;}
  }else if(e.st==='wind'){e.vx=0;if(e.tm<=0){mobSlash(e,74,2.2,'#ffffff');e.vx=e.face*260;e.st='rec';e.tm=.85;e.tele=0;}}
  else if(e.st==='rec'){e.vx*=.8;if(e.tm<=0){e.st='walk';e.cd=1.4*ai.cd;}}
 },
 mage(e,dt,p,ai,pc,ec,dx,ad){
  e.cd2=(e.cd2||0)-dt;
  if(e.st==='walk'){
   if(ad<170&&e.cd2<=0&&e.on){
    const side=Math.random()<.5?-1:1;let nx=pc+side*340;if(supportAt(nx,e.y+e.h)===null)nx=pc-side*340;
    if(supportAt(nx,e.y+e.h)!==null){burst(ec,e.y+e.h/2,'#b36bff',16,200,.5,3);ring(ec,e.y+e.h/2,50,'#b36bff',.3);e.x=clamp(nx-e.w/2,0,G.L.W-e.w);e.y=groundY(nx,e.y+e.h)-e.h;burst(nx,e.y+e.h/2,'#b36bff',16,200,.5,3);e.cd2=4;sfx('skill');}
   }
   if(ad<290)walk(e,-e.face,e.spd,false);else if(ad>480*ai.range)walk(e,e.face,e.spd,true);else e.vx=0;
   if(e.cd<=0&&ad<620*ai.range&&!p.dead){e.st='wind';e.tm=.9*ai.wind;e.vx=0;e.tele=1;e.tx=clamp(pc+p.vx*.9*ai.aim,40,G.L.W-40);
    const gy=groundY(e.tx,p.y+p.h);for(let k=0;k<(ai.ag>1.1?3:1);k++)G.vfx.push({k:'warn',x:e.tx+(k-(ai.ag>1.1?1:0))*95,y:gy,r:34,t:0,max:.9*ai.wind});}

     G.sched.push({t:k*.18,fn:()=>{addBox({own:'e',x:px-28,y:gy-330,w:56,h:330,dmg:e.dmg,life:.3,kb:1,vis:'pillar',col:'#b36bff'});G.vfx.push({k:'pillar',x:px,y:gy,w:56,h:330,t:0,max:.35,col:'#b36bff'});addShake(3);sfx('boom');}});}
    e.st='walk';e.cd=rnd(2.6,3.4)*ai.cd;e.tele=0;}}
 },
 ninja(e,dt,p,ai,pc,ec,dx,ad){
  if(e.st==='walk'){
   walk(e,e.face,e.spd,true);
   if(ad<250&&ad>60&&e.cd<=0&&!p.dead&&Math.abs(p.y-e.y)<80){e.st='wind';e.tm=.3*ai.wind;e.vx=0;e.tele=1;}
   else if(ad<60&&e.cd<=0&&!p.dead){mobSlash(e,56,1);e.cd=.8*ai.cd;}
  }else if(e.st==='wind'){e.vx=0;
   if(e.tm<=0){const tx=pc-e.face*80;
    if(supportAt(tx,e.y+e.h)!==null){e.vy=-740;e.vx=clamp((tx-ec)/.75,-520,520);e.on=false;e.st='leap';e.tm=.2;}
    else{mobSlash(e,60,1);e.st='walk';e.cd=1.4*ai.cd;}
    e.tele=0;}}
  else if(e.st==='leap'){
   if(e.tm<=0&&e.on){e.vx=0;e.face=-e.face;mobSlash(e,70,1.2);e.cd2=1;e.st='rec';e.tm=.55;}
  }else if(e.st==='rec'){e.vx*=.8;if(e.tm<=0){e.st='walk';e.cd=1.6*ai.cd;}}
 }
};
function updFlyer(e,dt,p,ai,pc,ec,dx,ad){
 e.ph+=dt;
 if(!e.aggro){e.y+=Math.sin(e.ph*2)*.3;return;}
 const sl=e.slow>0?.5:1;
 if(e.stun>0||e.kb>0){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=.92;e.vy*=.92;}
 else if(e.st==='walk'){
  e.face=dx>0?1:-1;
  const tx=pc+Math.sin(e.ph*1.3)*200*ai.range,ty=GY-210+Math.sin(e.ph*2)*25;
  e.vx+=(clamp((tx-ec)*2,-e.spd*1.6*ai.spd,e.spd*1.6*ai.spd)*sl-e.vx)*Math.min(1,dt*3);
  e.vy+=(clamp((ty-e.y)*2,-120,120)-e.vy)*Math.min(1,dt*3);
  e.x+=e.vx*dt;e.y+=e.vy*dt;
  if(e.cd<=0&&ad<700*ai.range&&!p.dead){e.st='wind';e.tm=.55*ai.wind;e.tele=1;}
 }else if(e.st==='wind'){e.vx*=.9;e.vy*=.9;
  if(e.tm<=0){const v=lead(ec,e.y+e.h/2,520,p,ai.aim*.6);e.vx=v[0];e.vy=v[1];e.st='dive';e.tm=.8;e.hitDone=false;e.tele=0;}
 }else if(e.st==='dive'){
  e.x+=e.vx*dt;e.y+=e.vy*dt;
  if(!e.hitDone&&!p.dead&&ov(e,p))e.hitDone=hurtPlayer(e.dmg,ec,1)||e.hitDone;
  if(e.tm<=0||e.y+e.h>GY+10){e.st='walk';e.cd=rnd(2,3)*ai.cd;}
 }
 e.x=clamp(e.x,0,G.L.W-e.w);e.y=clamp(e.y,20,GY-e.h+10);
}

function bcx(b){return b.x+b.w/2;}
function bossShock(b,k){
 const c=BOSSES[b.bi].c,bc=bcx(b);
 for(const d of[-1,1])addProj({own:'e',kind:'wave',sty:'rock',x:bc+d*b.w/2,y:b.y+b.h-24,w:60,h:48,vx:d*(400+(k||0)),dmg:b.dmg,life:1.8,ign:true,col:c});
 vfx({k:'quake',x:bc,y:b.y+b.h,r:140,col:c,max:.5});addShake(10);burst(bc,b.y+b.h,c,24,260,.6,4,400);sfx('boom');
}
function bossAim(b,spd,dmg,spread,sty){
 const bc=bcx(b),by=b.y+b.h*.35,P=G.P,ai=AIw(),v=lead(bc,by,spd,P,ai.aim),a=Math.atan2(v[1],v[0])+rnd(-spread,spread);
 addProj({own:'e',sty:sty||'orb',x:bc,y:by,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:8,dmg,life:3,col:BOSSES[b.bi].c2,trail:1});sfx('shoot');
}
function bossTouch(b,mul){if(!b.hitDone&&!G.P.dead&&ov(b,G.P)){b.hitDone=hurtPlayer(b.dmg*mul,bcx(b),1.3)||b.hitDone;}}
function warnAt(x,r,t,col){const g=groundY(x,G.P.y+G.P.h);vfx({k:'warn',x,y:g,r,max:t,col:col||'#ff4d6d'});return g;}
function bossPillar(b,x,w,h,t,col,dmgM){
 const g=warnAt(x,w*.6,t,col);
 G.sched.push({t,fn:()=>{if(!G)return;addBox({own:'e',x:x-w/2,y:g-h,w,h,dmg:b.dmg*(dmgM||1),life:.25,kb:1,vis:'none',col});vfx({k:'pillar',x,y:g,w,h,col,max:.45});addShake(4);burst(x,g,col,12,200,.5,3);sfx('boom');}});
}
function spawnMob(b,t,x,y,hpM){const e=mkEnemy(t,clamp(x,30,G.L.W-30),y,false,b);e.hp*=hpM||.45;e.maxHp=e.hp;G.enemies.push(e);burst(e.x+e.w/2,e.y+e.h/2,BOSSES[b.bi].c,16,180,.5,3);return e;}
function ownedCount(b){let n=0;for(const e of G.enemies)if(!e.dead&&e.owner===b)n++;return n;}
function fan(b,n,spread,spd,dmgM,sty,aimed){
 const bc=bcx(b),by=b.y+b.h*.4,P=G.P,base=aimed?Math.atan2(P.y+P.h/2-by,P.x+P.w/2-bc):(b.face>0?0:Math.PI);
 for(let k=0;k<n;k++){const a=base+(n>1?(k/(n-1)-.5)*spread:0);addProj({own:'e',sty:sty||'orb',x:bc,y:by,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:8,dmg:b.dmg*dmgM,life:3,col:BOSSES[b.bi].c2,trail:1});}
 sfx('shoot');
}

function chooseMove(b){
 const P=G.P,ai=AIw(),dx=P.x+P.w/2-bcx(b),ad=Math.abs(dx);
 const camp=b.campT>2;
 let tot=0;const ws=b.moves.map(m=>{let w=1;
  if(ai.ag>=1){const r=BM[m].rng;if(r==='near')w*=ad<260?3.2:.3;else if(r==='far')w*=ad>360?2.4:.5;
   if(camp&&AIRMV.includes(m))w*=3;
   if(m===b.lastMv)w*=.15;if(m===b.last2)w*=.5;
   if(ai.ag>=1.4&&P.hp<P.maxHp*.3&&BM[m].rng!=='far')w*=1.3;}
  else if(m===b.lastMv)w*=.4;
  if(m==='summon'&&(b.minions>=3||(b.mech!=='minions'&&b.minions>=2)))w=0;
  if(m==='turrets'&&b.minions>=2)w=0;
  if(b.mech==='minions'&&m==='summon'&&b.minions===0&&b.sumCd<=0)w=40;
  tot+=w;return w;});
 let r=Math.random()*tot,m=b.moves[0];for(let i=0;i<ws.length;i++){r-=ws[i];if(r<=0){m=b.moves[i];break;}}
 b.last2=b.lastMv;b.mv=m;b.lastMv=m;b.st='wind';b.t0=BM[m].wind*ai.wind*(b.en?.8:1);b.el=0;b.hitDone=false;b.actDone=false;b.rel=0;
 if(m==='summon')b.sumCd=8;
 if(BM[m].pre)BM[m].pre(b);
 b.face=P.x+P.w/2>bcx(b)?1:-1;b.turnT=b.mech==='armor'?1.3:.4;
 if(['laser','barrage','teleport','reap','meteor','dive','blink'].includes(m))sfx('warn');
}

 b.cd-=dt;b.turnT-=dt;b.contactCd-=dt;b.sumCd-=dt;b.flash=Math.max(0,b.flash-dt);b.slow=Math.max(0,b.slow-dt);

 if(b.mech==='exposed')b.vuln=Math.max(0,b.vuln-dt);

  if(b.turnT<=0&&Math.abs(dx)>8){b.face=dx>0?1:-1;b.turnT=b.mech==='armor'?1.3:.4;}

}

function fxUpdate(dt){
 for(const p of G.parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;}
 G.parts=G.parts.filter(p=>p.life>0);
 for(const f of G.fx){f.life-=dt;f.r+=(f.r1-f.r)*Math.min(1,dt*10);}
 G.fx=G.fx.filter(f=>f.life>0);
 const P=G.P;
 for(const v of G.vfx){v.t+=dt;if(v.follow){v.x=P.x+P.w/2;v.y=P.y+P.h/2;}}
 G.vfx=G.vfx.filter(v=>v.t<v.max);
 for(const t of G.texts){t.life-=dt;t.y-=40*dt;}
 G.texts=G.texts.filter(t=>t.life>0);
 for(const g of G.ghosts)g.life-=dt;G.ghosts=G.ghosts.filter(g=>g.life>0);
 for(const c of G.corpses){c.t+=dt;c.e.x+=c.vx*dt;c.e.y+=c.vy*dt;c.vy+=GRAV*dt*.8;c.vx*=.97;}
 G.corpses=G.corpses.filter(c=>c.t<c.max);
 for(const a of G.amb)a.ph+=dt;
 G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt*2.4);
}
function step(dt){
 const P=G.P,L=G.L;
 if(G.hitstop>0){G.hitstop-=dt;fxUpdate(dt*.3);return;}
 G.time+=dt;if(G.intro>0)G.intro-=dt;if(G.hintT>0)G.hintT-=dt;

  if(pl.mov){const nx=pl.mx+Math.sin(G.time*pl.sp+pl.ph)*pl.range;pl.dx=nx-pl.x;pl.x=nx;}
  if(pl.crumble){if(pl.cr>0){pl.cr-=dt;if(pl.cr<=0){pl.off=1.8;burst(pl.x+pl.w/2,pl.y,'#aab',10,120,.5,3,300);}}else if(pl.off>0)pl.off-=dt;}

  if(s===2){for(let i=0;i<2;i++)burst(h.x+h.w/2+rnd(-12,12),h.y-rnd(0,h.h),'#ff7a1a',1,40,.3,5,-200);}}}
 updPlayer(dt);
 for(let i=G.sched.length-1;i>=0;i--){const s=G.sched[i];s.t-=dt;if(s.t<=0){G.sched.splice(i,1);try{s.fn();}catch(e){}}}
 for(const e of G.enemies){
  if(e.dead)continue;
  e.flash=Math.max(0,e.flash-dt);e.cd-=dt;e.tm-=dt;e.stun=Math.max(0,e.stun-dt);e.kb=Math.max(0,e.kb-dt);e.show=Math.max(0,e.show-dt);e.orbCd=(e.orbCd||0)-dt;
  if(e.burn>0){e.burn-=dt;e.burnT-=dt;if(e.burnT<=0){e.burnT=.5;dotHit(e,e.burnD);if(e.dead)continue;}}
  if(e.boss)updBoss(e,dt);else updMob(e,dt);
 }
 G.enemies=G.enemies.filter(e=>!e.dead||(G.bossRef===e));
 updAllies(dt);updZones(dt);
 const hiGfx=S.set.gfx!=='low';
 for(const pr of G.projs){
  pr.life-=dt;pr.age+=dt;
  if(pr.hd>0)pr.hd-=dt;
  if(pr.home&&!(pr.hd>0)){
   let tg=pr.own==='p'?nearestEnemy(pr.x,650):(P.dead?null:P);
   if(tg){const tx=tg.x+tg.w/2,ty=tg.y+tg.h/2,a=Math.atan2(ty-pr.y,tx-pr.x),sp=pr.spd||350;
    pr.vx+=(Math.cos(a)*sp-pr.vx)*Math.min(1,dt*pr.home);pr.vy+=(Math.sin(a)*sp-pr.vy)*Math.min(1,dt*pr.home);}
  }
  if(pr.boomer&&pr.age>.45){
   const tg=pr.own==='p'?P:(pr.owner&&!pr.owner.dead?pr.owner:P),tx=tg.x+tg.w/2,ty=tg.y+tg.h/2,d=Math.hypot(tx-pr.x,ty-pr.y)||1,sp=pr.own==='p'?760:560;
   if(!pr.ret){pr.ret=1;pr.hit.clear();}
   pr.vx+=(tx-pr.x)/d*sp*Math.min(1,dt*6)-pr.vx*Math.min(1,dt*6)*0+0;pr.vx=(tx-pr.x)/d*sp;pr.vy=(ty-pr.y)/d*sp;
   if(d<30){pr.dead=true;continue;}
  }
  if(pr.sine){pr.x+=pr.vx*dt;pr.y=pr.sy+Math.sin(pr.age*pr.sine.f)*pr.sine.a;}
  else{pr.vy+=pr.grav*dt;pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;}
  if(pr.bounce){if(pr.x<20||pr.x>L.W-20){pr.vx=-pr.vx;pr.x=clamp(pr.x,20,L.W-20);}}
  if(pr.rehit){pr.rt-=dt;if(pr.rt<=0){pr.hit.clear();pr.rt=pr.rehit;}}
  if(pr.trail&&G.parts.length<500&&(hiGfx||Math.random()<.3))G.parts.push({x:pr.x,y:pr.y,vx:rnd(-30,30),vy:rnd(-30,30)+(pr.sty==='fire'||pr.sty==='comet'?-20:0),life:.3,max:.3,size:Math.max(2,pr.r*.45),col:pr.col,g:0});
  if(pr.life<=0){explode(pr);pr.dead=true;continue;}
  if(pr.y>VH+60||pr.x<-120||pr.x>L.W+120||(pr.y<-300&&pr.vy<0)){pr.dead=true;continue;}
  if(!pr.ign&&pr.orbA===undefined){let hit=false;for(const s of L.solids)if(pr.x>s.x&&pr.x<s.x+s.w&&pr.y>s.y&&pr.y<s.y+s.h){hit=true;break;}

  if(pr.own==='p'){
   for(const e of G.enemies){

  }else if(!P.dead&&!pr.hit.has('p')&&projHits(pr,P)){
   const sh=P.shield>0,ok=hurtPlayer(pr.dmg,pr.x-sgn(pr.vx||1)*30,pr.kind==='wave'?1.2:.8);

   if(ok||sh){if(pr.rehit||pr.kind==='wave')pr.hit.add('p');else if(!(pr.pierce>0)){explode(pr);pr.dead=true;}}
  }
 }
 G.projs=G.projs.filter(p=>!p.dead);
 for(const b of G.boxes){

  if(b.follow){
   if(b.beam){const cx=P.x+P.w/2,cy=P.y+P.h/2;b.x=b.f>0?cx:cx-b.len;b.y=cy-b.bh/2;}

  }

  if(b.own==='p'){
   for(const e of G.enemies){

    b.hit.add(e);
    const hy=b.circ?b.cy:b.y+b.h/2;

   }
  }else if(!P.dead&&!b.hit.has('p')&&boxHits(b,P)){
   if(hurtPlayer(b.dmg,b.circ?b.cx:b.x+b.w/2,b.kb||1))b.hit.add('p');
  }
 }

 else{G.clear-=dt;if(G.clear<=0)showWin();}

function drawWeapon(c,wp,hx,hy,ang,col,c2,t){
 const dx=Math.cos(ang),dy=Math.sin(ang);
 c.save();c.strokeStyle=c2;c.fillStyle=c2;c.lineWidth=3;
 const ln=L=>{c.beginPath();c.moveTo(hx,hy);c.lineTo(hx+dx*L,hy+dy*L);c.stroke();};
 switch(wp){
  case 'sword':c.strokeStyle=col;c.lineWidth=4;ln(34);c.strokeStyle=c2;c.lineWidth=2;ln(32);break;
  case 'spear':c.strokeStyle=c2;ln(52);c.fillStyle=col;c.beginPath();c.moveTo(hx+dx*52,hy+dy*52);c.lineTo(hx+dx*40-dy*5,hy+dy*40+dx*5);c.lineTo(hx+dx*40+dy*5,hy+dy*40-dx*5);c.fill();break;
  case 'staff':ln(38);c.fillStyle=col;c.beginPath();c.arc(hx+dx*40,hy+dy*40,5+Math.sin(t*8),0,6.3);c.fill();break;
  case 'gun':c.lineWidth=6;ln(16);c.strokeStyle=col;c.lineWidth=2;ln(18);break;
  case 'fist':c.fillStyle=col;c.beginPath();c.arc(hx+dx*3,hy+dy*3,6.5,0,6.3);c.fill();break;
  case 'dagger':c.strokeStyle=col;c.lineWidth=3;ln(16);break;
  case 'wand':ln(24);c.fillStyle=col;c.beginPath();c.arc(hx+dx*26,hy+dy*26,4,0,6.3);c.fill();break;
  case 'orb':c.fillStyle=col;c.beginPath();c.arc(hx+dx*10,hy+dy*10-2,6+Math.sin(t*6),0,6.3);c.fill();break;
  case 'wrench':ln(26);c.strokeStyle=col;c.lineWidth=5;c.beginPath();c.arc(hx+dx*28,hy+dy*28,5,0,6.3);c.stroke();break;
  case 'light':c.fillStyle='#fff';c.beginPath();c.arc(hx+dx*8,hy+dy*8,5,0,6.3);c.fill();c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.arc(hx+dx*8,hy+dy*8,9,0,6.3);c.stroke();break;
 }
 c.restore();
}
function drawHuman(c,cx,fy,face,o){

 c.strokeStyle=col;
 let r=o.atk||0,u=1-r,lunge=r>0?Math.sin(u*Math.PI)*6:0;
 if(lunge)c.translate(lunge,0);

 const hipY=-24+bob*.4;

 let ang=.75,backUp=0;
 if(o.melee){if(r>0){ang=u<.25?.75+(-2.3-.75)*(u/.25):-2.3+(1.4+2.3)*((u-.25)/.75);}}
 else if(r>0||o.cast>0){ang=-.05;}

}

const GLOWC={};
function glowSprite(col){
 if(GLOWC[col])return GLOWC[col];
 const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,col);r.addColorStop(.35,col);r.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=.9;g.fillStyle=r;g.fillRect(0,0,64,64);
 return GLOWC[col]=c;
}
function drawGlow(c,x,y,r,col,al){
 if(S.set.gfx==='low')return;
 c.save();c.globalCompositeOperation='lighter';c.globalAlpha=al==null?.6:al;c.drawImage(glowSprite(col),x-r,y-r,r*2,r*2);c.restore();
}
function drawVfx(c,v){

   for(let i=0;i<n;i++){const t0=i/n,t1=(i+1)/n;c.globalAlpha=a*(.15+.85*t1);c.strokeStyle=t1>.85?'#ffffff':col;c.lineWidth=v.w*(.25+.75*t1)*(1-p*.5);

   break;}
  case 'thrust':{

   break;}
  case 'punch':{
   c.translate(v.x,v.y);c.strokeStyle=col;c.shadowColor=col;c.shadowBlur=glowLvl();c.globalAlpha=a;c.lineWidth=5*a+1;
   c.beginPath();c.arc(0,0,10+p*46,0,6.3);c.stroke();c.lineWidth=3;
   for(let i=0;i<8;i++){const an=i/8*6.283,r0=12+p*30,r1=r0+16*a;c.beginPath();c.moveTo(Math.cos(an)*r0,Math.sin(an)*r0);c.lineTo(Math.cos(an)*r1,Math.sin(an)*r1);c.stroke();}

   c.beginPath();c.moveTo(-s,-s*.8);c.lineTo(s,s*.8);c.moveTo(-s,s*.8);c.lineTo(s,-s*.8);c.stroke();
   c.strokeStyle='#fff';c.lineWidth=w*.4;c.beginPath();c.moveTo(-s,-s*.8);c.lineTo(s,s*.8);c.moveTo(-s,s*.8);c.lineTo(s,-s*.8);c.stroke();
   break;}
  case 'spark':{
   c.translate(v.x,v.y);c.strokeStyle=col;c.lineCap='round';c.globalAlpha=a;c.shadowColor=col;c.shadowBlur=glowLvl();
   const s=v.s*(.4+p),n=6,rot=v.x*.3;c.lineWidth=3*a+.5;
   for(let i=0;i<n;i++){const an=i/n*6.283+rot,r0=s*.25,r1=s*(i%2?.7:1);c.beginPath();c.moveTo(Math.cos(an)*r0,Math.sin(an)*r0);c.lineTo(Math.cos(an)*r1,Math.sin(an)*r1);c.stroke();}

   break;}
  case 'bolt':{
   c.globalAlpha=a;c.lineJoin='round';c.lineCap='round';
   for(const[w,cl]of[[v.w*2.6,col],[v.w*.8,'#ffffff']]){c.strokeStyle=cl;c.lineWidth=w;c.shadowColor=col;c.shadowBlur=glowLvl()*1.4;c.beginPath();v.pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();}
   break;}

   c.fillStyle=g;c.beginPath();c.arc(v.x,v.y,r,0,6.3);c.fill();

   for(let i=0;i<12;i++){const an=i/12*6.283+p*.8,rr=r*(.8+.35*Math.sin(i*5+v.t*20));c.beginPath();c.moveTo(v.x+Math.cos(an-.14)*r*.5,v.y+Math.sin(an-.14)*r*.5);c.lineTo(v.x+Math.cos(an)*rr,v.y+Math.sin(an)*rr);c.lineTo(v.x+Math.cos(an+.14)*r*.5,v.y+Math.sin(an+.14)*r*.5);c.fill();}
   break;}
  case 'cosmic':{
   const r=v.r*Math.min(1,.2+p*1.6);c.translate(v.x,v.y);
   const g=c.createRadialGradient(0,0,r*.1,0,0,r);g.addColorStop(0,'rgba(255,255,255,'+a*.9+')');g.addColorStop(.5,col.length===7?col+'aa':col);g.addColorStop(1,'rgba(80,0,160,0)');
   c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,6.3);c.fill();
   c.strokeStyle='#fff';c.lineWidth=3;c.globalAlpha=a;for(let i=0;i<3;i++){c.beginPath();for(let t=0;t<30;t++){const an=t*.35+i*2.09+p*6,rr=t/30*r;c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}c.stroke();}
   c.fillStyle='#fff';for(let i=0;i<14;i++){const an=i*1.9+v.t*3,rr=(i%5+1)/5*r;c.fillRect(Math.cos(an)*rr,Math.sin(an)*rr,3,3);}
   break;}

   c.translate(v.x,v.y);c.strokeStyle=col;c.shadowColor=col;c.shadowBlur=glowLvl();c.globalAlpha=a;c.lineWidth=3;c.lineCap='round';
   const r=v.r*Math.min(1,p*2.5+.2);
   for(let i=0;i<6;i++){c.save();c.rotate(i*1.047+p);c.beginPath();c.moveTo(0,0);c.lineTo(r,0);c.moveTo(r*.55,0);c.lineTo(r*.75,r*.18);c.moveTo(r*.55,0);c.lineTo(r*.75,-r*.18);c.stroke();c.restore();}
   c.globalAlpha=a*.2;c.fillStyle=col;c.beginPath();c.arc(0,0,r,0,6.3);c.fill();
   break;}
  case 'quake':{
   c.translate(v.x,v.y);const r=v.r*Math.min(1,.2+p*1.5);c.globalAlpha=a;c.strokeStyle=col;c.shadowColor=col;c.shadowBlur=glowLvl();c.lineWidth=4*a+1;
   c.beginPath();c.ellipse(0,0,r,r*.22,0,0,6.3);c.stroke();
   c.lineWidth=3;for(let i=0;i<9;i++){const x=(i/8-.5)*2*r*.9;c.beginPath();c.moveTo(x,0);c.lineTo(x+(i%2?6:-6),-14-(i%3)*10*a);c.stroke();}
   c.fillStyle='rgba(180,170,150,'+a*.7+')';for(let i=0;i<8;i++){const x=(i/7-.5)*2*r*.8,y=-p*(30+(i%3)*26)+p*p*60;c.fillRect(x-3,y-3,6,6);}
   break;}
  case 'pillar':{
   const w=v.w*(1-p*.5),g=c.createLinearGradient(v.x-w/2,0,v.x+w/2,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,'+a+')');g.addColorStop(1,'rgba(255,255,255,0)');
   c.fillStyle=g;c.fillRect(v.x-w/2,v.y-v.h,w,v.h);

   c.globalAlpha=a;c.strokeStyle=col;c.lineWidth=4;c.beginPath();c.ellipse(v.x,v.y,w*(.8+p),8+p*10,0,0,6.3);c.stroke();

   if(v.circ){c.globalAlpha=pu*.25;c.beginPath();c.arc(v.x,v.y,v.r*Math.min(1,p*1.2+.1),0,6.3);c.fill();c.globalAlpha=pu;c.beginPath();c.arc(v.x,v.y,v.r,0,6.3);c.stroke();}
   else{c.beginPath();c.ellipse(v.x,v.y,v.r,v.r*.28,0,0,6.3);c.globalAlpha=pu*.3;c.fill();c.globalAlpha=pu;c.stroke();

    c.beginPath();c.moveTo(v.x,v.y-10);c.lineTo(v.x,v.y-110);c.globalAlpha=pu*.5;c.setLineDash([6,8]);c.stroke();}
   break;}

   c.strokeStyle=col;c.lineWidth=3;c.globalAlpha=.8;c.shadowColor=col;c.shadowBlur=glowLvl();
   for(let i=0;i<10;i++){const an=i/10*6.283+v.t*6,rr=v.r*(1-p)*1.3+14;c.beginPath();c.moveTo(v.x+Math.cos(an)*rr,v.y+Math.sin(an)*rr);c.lineTo(v.x+Math.cos(an)*(rr+16),v.y+Math.sin(an)*(rr+16));c.stroke();}

/* ===== Đạn theo kiểu ===== */
function drawProj(c,p){
 const gl=glowLvl(),col=p.col,ang=Math.atan2(p.vy,p.vx||.001);
 c.save();c.shadowColor=col;c.shadowBlur=gl;
 if(p.kind==='wave'){
  const w=p.w/2,h=p.h/2,d=sgn(p.vx),st=p.sty;
  c.translate(p.x,p.y);c.scale(d,1);
  if(st==='crescent'){
   c.globalAlpha=.95;c.fillStyle=col;c.beginPath();c.arc(-w*.3,0,h*1.25,-1.25,1.25);c.arc(-w*.75,0,h*1.1,1.15,-1.15,true);c.closePath();c.fill();
   c.fillStyle='#fff';c.globalAlpha=.9;c.beginPath();c.arc(-w*.3,0,h*1.25,-.9,.9);c.arc(-w*.45,0,h*1.18,.85,-.85,true);c.closePath();c.fill();

   c.fillStyle=col;c.globalAlpha=.8;c.beginPath();c.moveTo(-w,h);c.bezierCurveTo(-w*.4,h,w*.6,h*.6,w,-h*.2);c.bezierCurveTo(w*.3,-h*1.5,-w*.4,-h*1.3,-w*.5,-h*.2);c.bezierCurveTo(-w*.55,h*.4,-w*.8,h,-w,h);c.fill();
   c.fillStyle='#fff';c.globalAlpha=.7;for(let i=0;i<5;i++){c.beginPath();c.arc(-w*.4+i*w*.28,-h*.1-Math.sin(p.age*10+i)*h*.35,4,0,6.3);c.fill();}
   c.strokeStyle='#e8ffff';c.lineWidth=3;c.beginPath();c.moveTo(-w*.8,h*.6);c.quadraticCurveTo(0,-h*.5,w*.8,-h*.1);c.stroke();

   c.fillStyle='#5a4a3a';c.strokeStyle=col;c.lineWidth=3;c.globalAlpha=.95;c.beginPath();c.moveTo(-w,h);c.lineTo(-w*.5,-h*.3);c.lineTo(0,h*.2);c.lineTo(w*.5,-h);c.lineTo(w,h);c.closePath();c.fill();c.stroke();
  }else if(st==='sand'){
   c.fillStyle='rgba(255,207,90,.8)';for(let i=0;i<8;i++){c.beginPath();c.arc(-w+i*w*.28,Math.sin(p.age*12+i*2)*h*.5,h*(.5+.4*Math.sin(i)),0,6.3);c.fill();}
  }else{
   c.globalAlpha=.85;c.fillStyle=col;c.beginPath();c.moveTo(-w,h);c.quadraticCurveTo(w*.2,h,w,-h*.2);c.quadraticCurveTo(-w*.1,-h,-w,-h);c.closePath();c.fill();
   c.fillStyle='#fff';c.globalAlpha=.5;c.fillRect(-w*.4,-h*.1,w*.8,h*.25);
  }

 }
 c.translate(p.x,p.y);
 switch(p.sty){

   c.rotate(ang);const r=p.r;
   const g=c.createRadialGradient(0,0,0,0,0,r*1.6);g.addColorStop(0,'#fff6c0');g.addColorStop(.4,'#ffb030');g.addColorStop(1,'rgba(255,60,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,r*1.6,0,6.3);c.fill();
   c.fillStyle='rgba(255,110,20,.8)';c.beginPath();c.moveTo(0,-r*.8);c.quadraticCurveTo(-r*2.6,-r*.3+Math.sin(p.age*30)*3,-r*3.4,0);c.quadraticCurveTo(-r*2.6,r*.3,0,r*.8);c.fill();
   break;}
  case 'bolt':{c.rotate(ang);c.strokeStyle='#fff';c.lineWidth=p.r*.9;c.lineCap='round';c.beginPath();c.moveTo(-p.r*3.2,0);c.lineTo(-p.r*1.6,-3);c.lineTo(-p.r*.6,3);c.lineTo(p.r*1.4,0);c.stroke();c.strokeStyle=col;c.lineWidth=p.r*.4;c.stroke();break;}
  case 'ice':{c.rotate(ang+Math.PI/2);c.fillStyle='#e8ffff';c.strokeStyle=col;c.lineWidth=2;const r=p.r;c.beginPath();c.moveTo(0,-r*2);c.lineTo(r*.8,0);c.lineTo(0,r*1.1);c.lineTo(-r*.8,0);c.closePath();c.fill();c.stroke();break;}
  case 'rock':{c.rotate(p.age*6);c.fillStyle='#6a5646';c.strokeStyle=col;c.lineWidth=3;const r=p.r;c.beginPath();for(let i=0;i<7;i++){const an=i/7*6.283,rr=r*(.75+.3*Math.sin(i*3.1));c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}c.closePath();c.fill();c.stroke();break;}

  c.restore();
 }
 else if(b.vis==='dash'){c.save();c.globalAlpha=a*.5;c.fillStyle=b.col;c.fillRect(b.x,b.y,b.w,b.h);c.restore();}

   c.globalAlpha=a;c.fillStyle='#b8ffd0';for(let i=0;i<14;i++){const k=(t*.9+i/14)%1,x=Math.sin(i*5)*r*.7,y=-k*r*1.2;c.beginPath();c.arc(x,y,3*(1-k),0,6.3);c.fill();}

  case 'hole':case 'void':{const cl=z.kind==='void'?'#ff2bd6':'#7a5cff';
   const g=c.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'#000');g.addColorStop(.35,'rgba(10,0,30,.95)');g.addColorStop(.7,cl+'88');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,6.3);c.fill();
   c.strokeStyle=cl;c.shadowColor=cl;c.shadowBlur=glowLvl();c.lineWidth=3;for(let k=0;k<3;k++){c.beginPath();for(let i=0;i<26;i++){const an=i*.3+k*2.09-t*5,rr=r*(.2+i/26*.8);c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}c.stroke();}
   c.fillStyle='#000';c.beginPath();c.arc(0,0,r*.22,0,6.3);c.fill();break;}

function render(dt){
 const sc=cv.width/VW;ctx.setTransform(sc,0,0,sc,0,0);ctx.clearRect(0,0,VW,VH);
 if(G&&state!=='menu'){drawWorld(ctx);drawHUD(ctx);}else renderMenuBG(dt);
}
let lastT=performance.now(),acc=0;
function loop(now){
 requestAnimationFrame(loop);
 let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=.016;if(dt>.25)dt=.25;
 try{
  if(state==='play'&&G){acc+=dt;let n=0;while(acc>=1/60&&n<5&&state==='play'){step(1/60);acc-=1/60;n++;}if(n===5)acc=0;updateTouchCD();}
  else acc=0;
  render(dt);drawPreviews();
 }catch(err){console.error(err);window.__err=(window.__err||0)+1;}
}
function resize(){
 const w=innerWidth,h=innerHeight;let cw=w,ch=w*9/16;if(ch>h){ch=h;cw=h*16/9;}
 cv.style.width=cw+'px';cv.style.height=ch+'px';
 const dpr=Math.min(devicePixelRatio||1,S.set.gfx==='low'?1:2),bw=Math.min(1920,Math.max(480,Math.round(cw*dpr)));
 cv.width=bw;cv.height=Math.round(bw*9/16);applyLayout();
}

function setBind(a,code){
 const B=S.set.binds;for(const k in B){const i=B[k].indexOf(code);if(i>=0&&k!==a)B[k].splice(i,1);}
 if(!B[a])B[a]=[];if(B[a].length===0)B[a].push(code);else B[a][0]=code;
 const j=B[a].indexOf(code,1);if(j>0)B[a].splice(j,1);save();
}
addEventListener('keydown',e=>{
 if(UI.listen){e.preventDefault();if(e.code!=='Escape')setBind(UI.listen,e.code);UI.listen=null;showSettings();return;}
 audioInit();
 const B=S.set.binds;
 if(state==='play'||state==='pause')if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 inp.keys.add(e.code);
 if(e.repeat)return;
 if((state==='play'||state==='pause')&&B.pause.includes(e.code)){togglePause();return;}
 if(state==='play'){for(const a in B)if(a!=='pause'&&B[a].includes(e.code))inp.q[a]=true;}
});
addEventListener('keyup',e=>{inp.keys.delete(e.code);});
addEventListener('blur',()=>{inp.keys.clear();for(const k in inp.touch)inp.touch[k]=false;inp.jx=inp.jy=0;});

 const u=Math.min(innerWidth,innerHeight)/100,Ly=S.set.layout;
 document.querySelectorAll('#touch .el').forEach(el=>{const id=el.dataset.id,l=Ly[id];if(!l)return;
  const sz=TBASE[id]*l.s*u;el.style.width=sz+'px';el.style.height=sz+'px';el.style.left=l.x+'%';el.style.top=l.y+'%';
  if(id!=='joy')el.style.fontSize=Math.max(11,sz*.26)+'px';});
 $('touch').style.opacity=S.set.opacity;
}
function setTouchVisible(v){

function updateTouchCD(){
 if(!touchActive()||!G)return;const P=G.P,C=CHARS[P.ci];
 for(let i=0;i<3;i++){const el=document.querySelector('#touch [data-id="s'+(i+1)+'"] .cd');if(el)el.style.height=(P.cd[i]>0?P.cd[i]/C.sk[i].cd*100:0)+'%';}
}
let editSel=null;
function cap(el,id){try{el.setPointerCapture(id);}catch(e){}}
function initTouch(){
 const joy=$('tj'),knob=$('tk');let jp=null;
 const jmove=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2;
  let dx=(e.clientX-cx)/R,dy=(e.clientY-cy)/R;const d=Math.hypot(dx,dy);if(d>1){dx/=d;dy/=d;}
  inp.jx=dx;inp.jy=dy;knob.style.left=(50+dx*34)+'%';knob.style.top=(50+dy*34)+'%';};
 joy.addEventListener('pointerdown',e=>{if(UI.edit)return;e.preventDefault();jp=e.pointerId;cap(joy,jp);jmove(e);});
 joy.addEventListener('pointermove',e=>{if(UI.edit||e.pointerId!==jp)return;jmove(e);});
 const jend=e=>{if(e.pointerId!==jp)return;jp=null;inp.jx=0;inp.jy=0;knob.style.left='50%';knob.style.top='50%';};
 joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
 document.querySelectorAll('#touch .tb').forEach(el=>{
  const k=el.dataset.k;
  el.addEventListener('pointerdown',e=>{if(UI.edit)return;e.preventDefault();audioInit();cap(el,e.pointerId);inp.touch[k]=true;inp.q[k]=true;el.classList.add('act');});
  const up=e=>{if(UI.edit)return;inp.touch[k]=false;el.classList.remove('act');};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 });
 /* chế độ chỉnh vị trí nút */
 document.querySelectorAll('#touch .el').forEach(el=>{
  let drag=false;
  el.addEventListener('pointerdown',e=>{if(!UI.edit)return;e.preventDefault();drag=true;cap(el,e.pointerId);selectEl(el.dataset.id);});
  el.addEventListener('pointermove',e=>{if(!UI.edit||!drag)return;const l=S.set.layout[el.dataset.id];l.x=clamp(e.clientX/innerWidth*100,3,97);l.y=clamp(e.clientY/innerHeight*100,5,95);applyLayout();});
  const end=()=>{if(drag){drag=false;save();}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 });
}

 '<div class="big-score">'+G.score+'</div><div class="sub">Thưởng mạng còn lại: +'+bonus+' • 🏆 Kỷ lục: '+S.high+'</div><div class="row">'+
 (last?'<button class="btn big" data-a="maps">Chọn map ▶</button>':'<button class="btn big" data-a="next">Màn tiếp theo ▶</button>')+
 '</div><div class="row"><button class="btn" data-a="retry">↻ Chơi lại màn</button><button class="btn" data-a="maps">Chọn map</button><button class="btn" data-a="menu">Menu</button></div></div>',true);
}
/* chỉnh vị trí nút */
function showEditor(){
 UI.edit=true;hideGameUI();uiEl.className='hidden';
 $('touch').style.display='block';$('touch').classList.add('edit');applyLayout();
 const eb=$('editbar');eb.style.display='block';
 eb.innerHTML='<div style="font-size:13px;margin-bottom:4px">Chạm nút để chọn • kéo để di chuyển. Đang chọn: <b id="selname" style="color:#ffe600">—</b></div>'+
 '<div class="sl"><span>Kích thước</span><input type="range" data-e="size" min=".5" max="2" step=".05" value="1"><output>x1</output></div>'+
 '<div class="sl"><span>Độ mờ</span><input type="range" data-s="opacity" min=".3" max="1" step=".05" value="'+S.set.opacity+'"><output>'+fmtS('opacity',S.set.opacity)+'</output></div>'+
 '<button class="btn sm" data-a="resetlayout">Đặt lại</button><button class="btn sm on" data-a="doneedit">Xong</button>';
 selectEl('atk');
}
function endEditor(){UI.edit=false;$('touch').classList.remove('edit');$('touch').style.display='none';$('editbar').style.display='none';save();showSettings();}

/* ===== Xử lý thao tác UI ===== */
function act(a,v){
 sfx('click');audioInit();
 switch(a){
  case 'play':showChars();break;
  case 'help':showHelp();break;
  case 'menu':case 'quit':state='menu';G=G;hideGameUI();showMenu();break;
  case 'char':S.set.char=+v;save();showChars();break;
  case 'maps':showMaps();break;
  case 'map':UI.map=+v;showPrep();break;
  case 'ai':{const q=v.split(':');S.set[q[0]]=+q[1];}save();showPrep();break;
  case 'diff':S.set.diff=+v;save();showPrep();break;
  case 'stage':startStage(UI.map,+v,null);break;
  case 'settings':UI.from=v||'menu';showSettings();break;
  case 'setback':UI.listen=null;if(UI.from==='pause')showPause();else showMenu();break;
  case 'sound':S.set.sound=!S.set.sound;setVol();save();$('muteBtn').textContent=S.set.sound?'🔊':'🔇';showSettings();break;
  case 'gfx':S.set.gfx=v;save();resize();showSettings();break;
  case 'shake':S.set.shake=!S.set.shake;save();showSettings();break;
  case 'ctrl':S.set.ctrl=v;save();showSettings();break;
  case 'bind':UI.listen=v;showSettings();break;
  case 'resetbinds':S.set.binds=JSON.parse(JSON.stringify(DEFSET.binds));save();showSettings();break;
  case 'editlayout':showEditor();break;
  case 'resetlayout':S.set.layout=JSON.parse(JSON.stringify(DEFSET.layout));save();applyLayout();selectEl(editSel||'atk');break;
  case 'doneedit':endEditor();break;
  case 'unlockall':for(let i=0;i<10;i++)S.prog[i]=MAPS[i].stages;save();showSettings();break;
  case 'resetprog':if(confirm('Xóa toàn bộ tiến độ và kỷ lục?')){S.prog=Array(10).fill(0);S.high=0;save();}showSettings();break;
  case 'resume':togglePause();break;
  case 'retry':{const g=G;startStage(g.mi,g.si,{score:g.startScore,lives:S.set.lives});break;}
  case 'next':{const g=G;startStage(g.mi,g.si+1,{score:g.score,lives:g.lives});break;}
 }
}
uiEl.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset.v);});
document.addEventListener('click',e=>{const t=e.target.closest('#editbar [data-a]');if(t)act(t.dataset.a,t.dataset.v);});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.s){const k=t.dataset.s,v=parseFloat(t.value);S.set[k]=v;t.nextElementSibling.textContent=fmtS(k,v);if(k==='vol')setVol();if(k==='opacity')applyLayout();save();}
 else if(t.dataset&&t.dataset.e==='size'&&editSel){const l=S.set.layout[editSel];l.s=parseFloat(t.value);t.nextElementSibling.textContent='x'+l.s.toFixed(2);applyLayout();save();}
});
$('pauseBtn').addEventListener('click',()=>{if(state==='play'||state==='pause')togglePause();});
$('muteBtn').addEventListener('click',e=>{audioInit();S.set.sound=!S.set.sound;setVol();save();e.target.textContent=S.set.sound?'🔊':'🔇';});
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>audioInit(),{once:true});

/* ===== Khởi động ===== */
initTouch();resize();$('muteBtn').textContent=S.set.sound?'🔊':'🔇';
showMenu();requestAnimationFrame(loop);

</script>
</body>
</html>
