<style>
:root{--c1:#19e6ff;--c2:#ff2bd6;--c3:#ffe600;--bg:#070714;--tx:#e8f6ff}

html,body{margin:0;height:100%;background:#05050f;color:var(--tx);font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}

#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;touch-action:none}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
#ui.dim{background:rgba(3,3,14,.72);backdrop-filter:blur(3px)}
#ui.hidden{display:none}
.panel{max-width:min(1000px,98vw);max-height:96vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 18px;border:2px solid var(--c1);border-radius:16px;background:rgba(8,6,28,.9);box-shadow:0 0 18px var(--c1),inset 0 0 22px rgba(25,230,255,.14);text-align:center}

.title{font-size:clamp(34px,9vw,92px);font-weight:900;letter-spacing:.05em;margin:0;line-height:1;color:#fff;text-shadow:0 0 6px #fff,0 0 14px var(--c1),0 0 34px var(--c1),0 0 60px var(--c2);animation:fl 3s infinite}
.title span{color:var(--c2);text-shadow:0 0 6px #fff,0 0 14px var(--c2),0 0 34px var(--c2)}
@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.7}96%{opacity:1}98%{opacity:.8}}
h2{margin:4px 0 10px;font-size:clamp(20px,4vw,34px);color:#fff;text-shadow:0 0 10px var(--c1),0 0 22px var(--c1);letter-spacing:.04em}
h3{margin:10px 0 6px;font-size:16px;color:var(--c3);text-shadow:0 0 8px var(--c3)}
.sub{opacity:.8;font-size:14px;margin:6px 0}
.btn{display:inline-block;margin:5px;padding:11px 22px;font:700 clamp(14px,2.4vw,18px) inherit;font-family:inherit;color:#fff;background:linear-gradient(180deg,rgba(25,230,255,.22),rgba(25,230,255,.05));border:2px solid var(--c1);border-radius:12px;cursor:pointer;text-shadow:0 0 8px var(--c1);box-shadow:0 0 10px rgba(25,230,255,.55);transition:transform .1s,box-shadow .15s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 22px var(--c1)}
.btn:active{transform:scale(.97)}
.btn.big{font-size:clamp(20px,4vw,30px);padding:14px 52px;border-color:var(--c2);text-shadow:0 0 10px var(--c2);box-shadow:0 0 16px var(--c2);background:linear-gradient(180deg,rgba(255,43,214,.3),rgba(255,43,214,.06))}
.btn.sm{padding:6px 12px;font-size:14px;margin:2px}
.btn.on{background:var(--c1);color:#001018;text-shadow:none}
.btn.dis,.btn[disabled]{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:6px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:8px 0}
.card{position:relative;border:2px solid #3a4a7a;border-radius:12px;padding:10px;background:rgba(15,15,45,.8);cursor:pointer;transition:.15s;text-align:center}
.card:hover{border-color:var(--c1);box-shadow:0 0 16px var(--c1);transform:translateY(-3px)}
.card.sel{border-color:var(--c2);box-shadow:0 0 18px var(--c2)}
.card.locked{opacity:.4;filter:grayscale(1);pointer-events:none}
.card .nm{font-weight:800;margin-top:4px}
.card .ds{font-size:12px;opacity:.75}
.card canvas{width:100%;height:auto;border-radius:8px;display:block}
.stg{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;margin:4px;border-radius:50%;border:2px solid var(--c1);font-weight:900;cursor:pointer;background:rgba(25,230,255,.1)}
.stg.boss{border-color:var(--c2);color:var(--c2);box-shadow:0 0 12px var(--c2)}
.stg.done{background:var(--c1);color:#001018}
.stg.lock{opacity:.3;pointer-events:none}
.stg:hover{transform:scale(1.12);box-shadow:0 0 16px #fff}
.sl{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 56px;gap:8px;align-items:center;margin:5px 0;text-align:left;font-size:14px}
.sl output{text-align:right;color:var(--c3);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:#22305a;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--c1);box-shadow:0 0 10px var(--c1);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--c1);box-shadow:0 0 10px var(--c1)}

.kb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;border:1px solid #2a3a6a;border-radius:8px;margin:3px 0;font-size:14px}

#touch{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
#touch .el{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none}
#tj{border-radius:50%;border:3px solid rgba(25,230,255,.7);background:radial-gradient(circle,rgba(25,230,255,.12),rgba(25,230,255,.03));box-shadow:0 0 14px rgba(25,230,255,.6),inset 0 0 14px rgba(25,230,255,.25)}
#tk{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff,var(--c1));box-shadow:0 0 16px var(--c1);pointer-events:none}
.tb{border-radius:50%;border:3px solid var(--c2);background:rgba(255,43,214,.14);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px var(--c2),inset 0 0 12px rgba(255,43,214,.3);overflow:hidden;font-size:15px;text-shadow:0 0 8px var(--c2)}
.tb.jp{border-color:var(--c3);box-shadow:0 0 14px var(--c3);background:rgba(255,230,0,.12)}
.tb.sk{border-color:var(--c1);box-shadow:0 0 14px var(--c1);background:rgba(25,230,255,.12);font-size:20px}
.tb.act{filter:brightness(2)}
.tb .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.65);pointer-events:none}
.tb b{position:relative;z-index:1;pointer-events:none}
#touch.edit .el{outline:2px dashed #fff;cursor:grab}
#touch.edit .el.pick{outline:3px solid var(--c3)}
#editbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:9;display:none;padding:8px 12px;border:2px solid var(--c1);border-radius:12px;background:rgba(5,8,28,.92);text-align:center;max-width:96vw}
#editbar .sl{grid-template-columns:90px 1fr 46px;margin:2px 0}
#rot{position:absolute;inset:0;display:none;z-index:20;background:#05050f;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px;color:var(--c1)}
@media(orientation:portrait){body.tplay #rot{display:flex}}

<canvas id="cv"></canvas>

 <div class="el tb sk" data-id="s2" data-k="s2"><b>2</b><i class="cd"></i></div>

 char:0,diff:0,lives:3,hpM:1,dmgM:1,skM:1,dropMob:20,dropBoss:60,healPct:25};
function mergeDeep(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object')mergeDeep(t[k],s[k]);else t[k]=s[k];}}
function loadSave(){let d=null;try{d=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
 const b={high:0,prog:Array(10).fill(0),set:JSON.parse(JSON.stringify(DEFSET))};
 if(d&&typeof d==='object'){b.high=+d.high||0;if(Array.isArray(d.prog))for(let i=0;i<10;i++)b.prog[i]=+d.prog[i]||0;if(d.set&&typeof d.set==='object')mergeDeep(b.set,d.set);}
 return b;}
let S=loadSave();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}

/* ===== Âm thanh (Web Audio) ===== */
let AC=null,master=null,noiseBuf=null;const lastSfx={};
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);setVol();}catch(e){AC=null}}
function setVol(){if(master)master.gain.value=S.set.sound?S.set.vol*.5:0;}
function tone(type,f0,f1,dur,vol=.3,delay=0){if(!AC||!S.set.sound)return;const t=AC.currentTime+delay;
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
 o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);
 g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol=.3,hp=800){if(!AC||!S.set.sound)return;
 if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}
const SFX={

 atk:()=>{noise(.08,.15,2000);tone('sawtooth',500,200,.08,.08)},
 hit:()=>{noise(.1,.2,1200);tone('square',200,80,.1,.12)},
 skill:()=>{tone('sawtooth',200,900,.25,.15);tone('square',400,1200,.2,.08,.05)},
 shoot:()=>tone('square',900,300,.1,.07),
 hurt:()=>{tone('sawtooth',300,60,.3,.25);noise(.15,.2,500)},
 die:()=>{tone('sawtooth',400,40,.6,.25);noise(.4,.25,300)},
 pick:()=>{tone('triangle',600,1200,.12,.2);tone('triangle',900,1800,.15,.2,.08)},
 boom:()=>{noise(.5,.4,100);tone('sine',120,30,.5,.4)},
 win:()=>{[523,659,784,1047].forEach((f,i)=>tone('square',f,f,.2,.15,i*.12))},
 lose:()=>{[400,330,260,180].forEach((f,i)=>tone('sawtooth',f,f*.9,.3,.18,i*.18))},
 click:()=>tone('square',700,900,.05,.1),
 boss:()=>{tone('sawtooth',90,50,.8,.3);tone('square',60,40,.8,.2)},
 spring:()=>tone('sine',200,900,.25,.2),
 warn:()=>tone('square',500,500,.12,.12)
};
function sfx(n){if(!AC)return;const t=performance.now();if(lastSfx[n]&&t-lastSfx[n]<45)return;lastSfx[n]=t;try{SFX[n]&&SFX[n]();}catch(e){}}

/* ===== Sinh màn chơi (địa hình kiểu Contra) ===== */
function genLevel(mi,si){
 const M=MAPS[mi],isBoss=si===M.stages-1,R=srand(mi*977+si*131+11);
 const L={solids:[],plats:[],springs:[],spikes:[],spawns:[],W:0,boss:isBoss,segs:[]};
 const mkSeg=(x,w,top)=>{L.solids.push({x,y:top,w,h:VH+400-top});L.segs.push({x,w,top});};
 if(isBoss){
  L.W=1400;mkSeg(0,1400,GY);
  L.plats.push({x:150,y:GY-120,w:190,h:12},{x:1060,y:GY-120,w:190,h:12},{x:600,y:GY-225,w:200,h:12});
  L.springs.push({x:690,y:GY-12,w:44,h:12,a:0});
  return L;
 }
 L.W=2300+si*200+mi*40;
 let x=0,top=GY;
 mkSeg(0,420,GY);x=420;
 const decor=(x,w,top)=>{
  if(w<300)return;const d=R();
  if(d<.45){const n=1+Math.floor(R()*2);
   for(let k=0;k<n;k++){const px=x+30+R()*(w-250),py=top-(95+R()*45);
    L.plats.push({x:px,y:py,w:120+R()*100,h:12});
    if(R()<.4)L.plats.push({x:px+30+R()*70,y:py-88-R()*25,w:110+R()*70,h:12});}
  }else if(d<.65){const sx=x+w*.5;L.springs.push({x:sx,y:top-12,w:44,h:12,a:0});L.plats.push({x:sx-90,y:top-285,w:220,h:12});}
  else if(d<.85&&x>600){L.spikes.push({x:x+w*.4,y:top-16,w:60+R()*50,h:16});}
 };
 while(x<L.W-520){
  const r=R();
  if(r<.22&&x>600){
   const gap=110+Math.floor(R()*50);
   if(R()<.5)L.plats.push({x:x+gap/2-45,y:top-70,w:90,h:12,mov:1,mx:x+gap/2-45,range:35,sp:1.5,ph:R()*6,dx:0});
   x+=gap;const w=260+Math.floor(R()*200);mkSeg(x,w,top);decor(x,w,top);x+=w;continue;
  }
  let nt=top;const hr=R();if(hr<.3&&top>GY-80)nt=top-40;else if(hr<.5&&top<GY)nt=top+40;
  const w=300+Math.floor(R()*260);top=nt;mkSeg(x,w,top);decor(x,w,top);x+=w;
 }
 mkSeg(x,L.W-x,top);
 const topAt=px=>{for(const s of L.segs)if(px>=s.x+10&&px<=s.x+s.w-10)return s.top;return null;};
 const n=7+si*2+(mi>>1);
 for(let k=0;k<n;k++){
  let sx=540+(L.W-860)*(k+R()*.8)/n;let tp=topAt(sx);let g=0;
  while(tp===null&&g++<40){sx+=20;tp=topAt(sx);}
  if(tp===null)continue;
  for(const sp of L.spikes)if(sx>sp.x-30&&sx<sp.x+sp.w+30)sx=sp.x+sp.w+40;
  const rr=R(),t=rr<.5?'grunt':rr<.8?'gunner':'flyer';
  L.spawns.push({t,x:sx,y:t==='flyer'?tp-200:tp,elite:si>=2&&R()<.12+si*.03});
 }
 return L;
}

/* ===== Va chạm / vật lý (AABB) ===== */
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function phys(e,dt,L,noGrav){
 if(e.gnd&&e.gnd.dx)e.x+=e.gnd.dx;
 e.hitWall=false;
 e.x+=e.vx*dt;
 for(const s of L.solids){
  if(e.x<s.x+s.w&&e.x+e.w>s.x&&e.y<s.y+s.h&&e.y+e.h>s.y){
   if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;
   else e.x=(e.x+e.w/2<s.x+s.w/2)?s.x-e.w:s.x+s.w;
   e.hitWall=true;
  }
 }
 e.x=clamp(e.x,0,L.W-e.w);
 const py=e.y;
 if(!noGrav)e.vy+=GRAV*dt;
 e.y+=e.vy*dt;e.on=false;e.gnd=null;
 for(const s of L.solids){
  if(e.x<s.x+s.w&&e.x+e.w>s.x&&e.y<s.y+s.h&&e.y+e.h>s.y){
   if(e.vy>=0){e.y=s.y-e.h;e.vy=0;e.on=true;}
   else{e.y=s.y+s.h;e.vy=0;}
  }
 }
 if(e.vy>=0&&!(e.drop>0)){
  for(const p of L.plats){
   if(e.x+e.w>p.x&&e.x<p.x+p.w){
    const pb=py+e.h,nb=e.y+e.h;
    if(pb<=p.y+1&&nb>=p.y){e.y=p.y-e.h;e.vy=0;e.on=true;e.gnd=p;}
   }
  }
 }
}

function burst(x,y,col,n,spd,life,size,grav){
 if(!G)return;const q=S.set.gfx;const cap=q==='high'?900:q==='med'?450:160;
 n=Math.ceil(n*(q==='high'?1:q==='med'?.6:.3));
 for(let i=0;i<n&&G.parts.length<cap;i++){const a=Math.random()*6.283,s=rnd(.2,1)*spd;
  G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.5,1)*life,max:life,size:rnd(.5,1)*size,col,g:grav||0});}
}
function ring(x,y,r1,col,life){G.fx.push({x,y,r:6,r1,life:life||.35,max:life||.35,col});}
function text(x,y,s,col,big){G.texts.push({x,y,s:String(s),col,life:.9,max:.9,big:!!big});}
function addShake(v){if(S.set.shake&&G)G.shake=Math.min(14,Math.max(G.shake,v));}
function addProj(o){G.projs.push(Object.assign({own:'p',vx:0,vy:0,r:8,dmg:10,life:1.5,pierce:0,grav:0,col:'#fff',kind:'orb',boom:0,stun:0},o,{hit:new Set()}));}
function addBox(o){const b=Object.assign({own:'p',life:.15,rehit:99,rt:0,dmg:10,kb:240,stun:0,vis:'none',col:'#fff'},o,{hit:new Set()});b.max=b.life;G.boxes.push(b);return b;}
function boxHits(b,e){
 if(b.circ){const cx=clamp(b.cx,e.x,e.x+e.w),cy=clamp(b.cy,e.y,e.y+e.h);const dx=b.cx-cx,dy=b.cy-cy;return dx*dx+dy*dy<=b.r*b.r;}
 return ov(b,e);
}
function projHits(p,e){
 if(p.w){return Math.abs(p.x-(e.x+e.w/2))<p.w/2+e.w/2&&Math.abs(p.y-(e.y+e.h/2))<p.h/2+e.h/2;}
 const cx=clamp(p.x,e.x,e.x+e.w),cy=clamp(p.y,e.y,e.y+e.h);const dx=p.x-cx,dy=p.y-cy;return dx*dx+dy*dy<=p.r*p.r;
}

function healPlayer(pct,flat){const p=G.P;const v=flat||p.maxHp*pct;p.hp=Math.min(p.maxHp,p.hp+v);
 text(p.x+p.w/2,p.y-10,'+'+Math.round(v),'#5dff6a',true);burst(p.x+p.w/2,p.y+p.h/2,'#5dff6a',14,160,.7,3);}
function hurtPlayer(dmg,srcX,kb){
 const p=G.P;if(p.dead||p.inv>0)return false;
 if(p.shield>0){burst(p.x+p.w/2,p.y+p.h/2,'#8fe4ff',8,200,.4,3);sfx('click');return false;}
 dmg=Math.max(1,Math.round(dmg));p.hp-=dmg;p.inv=.9;p.flash=.2;
 const d=sgn(p.x+p.w/2-srcX);p.vx=d*300*(kb||1);p.vy=-260;p.dash.t=0;
 text(p.x+p.w/2,p.y-6,'-'+dmg,'#ff4d6d',true);burst(p.x+p.w/2,p.y+p.h/2,'#ff4d6d',16,220,.6,3);

 return true;
}
function killPlayer(){
 const p=G.P;p.dead=true;p.hp=0;p.respT=1.7;G.lives--;p.orbit=null;p.slam=null;
 burst(p.x+p.w/2,p.y+p.h/2,CHARS[p.ci].c,40,300,1,4);ring(p.x+p.w/2,p.y+p.h/2,120,CHARS[p.ci].c,.5);
 addShake(12);sfx('die');

}
function respawn(){
 const p=G.P;if(G.lives<=0)return;
 p.dead=false;p.hp=p.maxHp;p.x=p.safe.x;p.y=p.safe.y;p.vx=0;p.vy=0;p.inv=2.5;p.shield=0;
 for(const e of G.enemies)if(!e.dead&&!e.boss&&Math.abs(e.x-p.x)<90&&!e.fly)e.x+=sgn(e.x-p.x)*140;
}
function enemyMul(e,srcX,hy){
 if(!e.boss)return 1;const m=e.mech;
 if(m==='armor'){const front=(srcX>e.x+e.w/2)===(e.face>0);return front?.18:1.3;}
 if(m==='weak')return hy<e.y+e.h*.35?2.2:.4;
 if(m==='exposed')return e.vuln>0?1.6:.12;
 if(m==='cycle')return e.shieldOn?.05:1.2;
 if(m==='minions')return e.minions>0?.05:1;
 return 1;
}
function hitEnemy(e,dmg,srcX,hy,o){
 if(e.dead||e.alpha<.5&&e.boss)return;
 const mul=enemyMul(e,srcX,hy),d=dmg*mul;e.hp-=d;e.flash=.12;e.show=2.5;
 text(e.x+e.w/2+rnd(-10,10),e.y-4,mul<.3?'MIỄN':Math.round(d),mul<.3?'#8899aa':mul>1.4?'#ffe600':'#ffffff',mul>1.4);
 if(!e.boss){e.kb=.15;e.vx=sgn(e.x+e.w/2-srcX)*((o&&o.kb)||220);if(!e.fly)e.vy=-160;if(o&&o.stun)e.stun=Math.max(e.stun,o.stun);}
 burst(e.x+e.w/2,hy,e.boss?BOSSES[e.bi].c:'#ffffff',6,170,.4,2.5);
 sfx('hit');addShake(e.boss?2:1.5);
 if(e.hp<=0)killEnemy(e);
}
function dropHeal(x,y,rate){
 if(Math.random()*100<rate)G.items.push({x:x-10,y:y-10,w:20,h:20,vx:rnd(-60,60),vy:-300,pct:S.set.healPct/100,t:0,on:false,gnd:null,drop:0});

function killEnemy(e){
 if(e.dead)return;e.dead=true;e.hp=0;
 const cx=e.x+e.w/2,cy=e.y+e.h/2,D=DIFFS[G.diff];
 G.score+=Math.round(e.score*D.m);G.kills++;

function updPlayer(dt){

 if(p.dead){p.respT-=dt;if(p.respT<=0)respawn();return;}
 p.inv=Math.max(0,p.inv-dt);p.atkT=Math.max(0,p.atkT-dt);p.atkAnim=Math.max(0,p.atkAnim-dt);p.shield=Math.max(0,p.shield-dt);
 p.buffT=Math.max(0,p.buffT-dt);if(p.buffT<=0){p.buffM=1;p.buffS=1;}
 p.flash=Math.max(0,p.flash-dt);p.castAnim=Math.max(0,p.castAnim-dt);p.drop=Math.max(0,p.drop-dt);p.comboT-=dt;if(p.comboT<=0)p.combo=0;
 for(let i=0;i<3;i++)p.cd[i]=Math.max(0,p.cd[i]-dt);
 const ax=Math.abs(inp.jx)>.18?inp.jx:((held('right')?1:0)-(held('left')?1:0));
 const down=held('down')||inp.jy>.65;
 if(p.dash.t>0){p.dash.t-=dt;p.vx=p.dash.v;p.vy=0;}
 else{const tv=ax*C.spd*p.buffS;p.vx+=(tv-p.vx)*Math.min(1,dt*(p.on?16:8));}
 if(ax!==0)p.face=ax>0?1:-1;
 if(p.on){p.coy=.1;p.jumps=1;}else p.coy-=dt;
 if((inp.q.jump&&down&&p.gnd)||(inp.q.down&&p.gnd)){p.drop=.25;p.y+=3;p.on=false;p.gnd=null;}
 else if(inp.q.jump){
  if(p.on||p.coy>0){p.vy=-C.jump;p.coy=0;p.on=false;sfx('jump');burst(p.x+p.w/2,p.y+p.h,'#ffffff',6,100,.3,2);}
  else if(p.jumps>0){p.jumps--;p.vy=-C.jump*.92;sfx('jump');ring(p.x+p.w/2,p.y+p.h,26,C.c,.3);}
 }
 if(!held('jump')&&p.vy<0&&p.dash.t<=0&&!p.slam)p.vy+=GRAV*dt*1.3;
 if(p.slam&&!p.on&&p.vy>0){p.slam.air=true;p.vy+=2600*dt;}
 phys(p,dt,L,p.dash.t>0);
 if(p.slam&&p.slam.air&&p.on){const s=p.slam;p.slam=null;const cx=p.x+p.w/2,cy=p.y+p.h;
  addBox({own:'p',circ:1,cx,cy,r:s.r,dmg:s.dmg,life:.25,kb:420,vis:'ring',col:C.c});ring(cx,cy,s.r,C.c,.4);burst(cx,cy,C.c,30,300,.6,4);addShake(10);sfx('boom');}
 for(const sp of L.springs){sp.a=Math.max(0,sp.a-dt);if(ov(p,sp)&&p.vy>=0){p.vy=-1180;p.on=false;p.jumps=1;sp.a=.3;sfx('spring');burst(sp.x+sp.w/2,sp.y,'#ffe600',10,160,.4,3);}}
 for(const sk of L.spikes)if(ov(p,sk)&&p.inv<=0){hurtPlayer(p.maxHp*.12,sk.x+sk.w/2,.6);p.vy=-420;}
 if(p.y>VH+80){
  p.hp-=p.maxHp*.2;text(p.x,VH-60,'-'+Math.round(p.maxHp*.2),'#ff4d6d',true);sfx('hurt');
  if(p.hp<=0){p.hp=0;killPlayer();}else{p.x=p.safe.x;p.y=p.safe.y;p.vx=0;p.vy=0;p.inv=1.5;}
 }
 if(p.on&&!p.gnd){p.safeT+=dt;
  if(p.safeT>.5){const cx=p.x+p.w/2;for(const s of L.segs)if(cx-s.x>50&&s.x+s.w-cx>50&&Math.abs(p.y+p.h-s.top)<2){p.safe={x:p.x,y:p.y};break;}}
 }else if(!p.on)p.safeT=0;

 if(inp.q.s1)castSkill(0);if(inp.q.s2)castSkill(1);if(inp.q.s3)castSkill(2);
 p.anim+=dt*(Math.abs(p.vx)>40?1:.3);
 if(p.orbit){const o=p.orbit;o.t-=dt;o.a+=dt*5;const cx=p.x+p.w/2,cy=p.y+p.h/2;
  for(let k=0;k<o.n;k++){const a=o.a+k*6.283/o.n,bx=cx+Math.cos(a)*o.r,by=cy+Math.sin(a)*o.r*.7;

function updMob(e,dt){
 const p=G.P,L=G.L,pc=p.x+p.w/2,ec=e.x+e.w/2,dx=pc-ec,ad=Math.abs(dx);
 e.anim+=dt;
 if(!e.aggro&&ad<820&&!p.dead)e.aggro=true;
 if(e.fly){
  e.ph+=dt;
  if(!e.aggro){e.y+=Math.sin(e.ph*2)*.3;return;}
  if(e.stun>0||e.kb>0){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=.92;e.vy*=.92;}
  else if(e.st==='walk'){
   e.face=dx>0?1:-1;
   const tx=pc+Math.sin(e.ph*1.3)*200,ty=GY-210+Math.sin(e.ph*2)*25;
   e.vx+=(clamp((tx-ec)*2,-e.spd*1.6,e.spd*1.6)-e.vx)*Math.min(1,dt*3);
   e.vy+=(clamp((ty-e.y)*2,-120,120)-e.vy)*Math.min(1,dt*3);
   e.x+=e.vx*dt;e.y+=e.vy*dt;
   if(e.cd<=0&&ad<700&&!p.dead){e.st='wind';e.tm=.55;}
  }else if(e.st==='wind'){
   e.vx*=.9;e.vy*=.9;
   if(e.tm<=0){const tx=pc-ec,ty=p.y+p.h/2-(e.y+e.h/2),d=Math.hypot(tx,ty)||1;e.vx=tx/d*520;e.vy=ty/d*520;e.st='dive';e.tm=.8;e.hitDone=false;}
  }else if(e.st==='dive'){
   e.x+=e.vx*dt;e.y+=e.vy*dt;
   if(!e.hitDone&&!p.dead&&ov(e,p)){e.hitDone=hurtPlayer(e.dmg,ec,1)||e.hitDone;}
   if(e.tm<=0||e.y+e.h>GY+10){e.st='walk';e.cd=rnd(2,3);}
  }
  e.x=clamp(e.x,0,L.W-e.w);e.y=clamp(e.y,20,GY-e.h+10);
  return;
 }
 let touchedBy=null;
 if(!e.aggro){phys(e,dt,L);return;}
 if(e.stun>0||e.kb>0){e.vx*=.9;}
 else if(e.t==='grunt'){
  if(e.st==='walk'){
   e.face=dx>0?1:-1;e.vx=e.face*e.spd;
   if(ad<62&&e.cd<=0&&Math.abs(p.y-e.y)<70&&!p.dead){e.st='wind';e.tm=.45;e.vx=0;}
   if(e.hitWall&&e.on)e.vy=-640;
  }else if(e.st==='wind'){
   e.vx=0;
   if(e.tm<=0){
    addBox({own:'e',x:e.face>0?e.x+e.w-6:e.x-58,y:e.y,w:64,h:e.h,dmg:e.dmg,life:.12,kb:1,vis:'slash',col:MAPS[G.mi].acc});sfx('atk');
    e.st='rec';e.tm=.45;e.vx=e.face*200;
   }
  }else if(e.st==='rec'){e.vx*=.85;if(e.tm<=0){e.st='walk';e.cd=1.2;}}
 }else if(e.t==='gunner'){
  if(e.st==='walk'){
   e.face=dx>0?1:-1;
   if(ad<230)e.vx=e.hitWall?0:-e.face*e.spd;else if(ad>400)e.vx=e.face*e.spd;else e.vx=0;
   if(e.cd<=0&&ad<650&&!p.dead){e.st='wind';e.tm=.4;e.vx=0;}
  }else if(e.st==='wind'){
   e.vx=0;
   if(e.tm<=0){
    const sx=ec+e.face*16,sy=e.y+e.h*.4,tt=Math.max(.2,ad/330),vy=clamp((p.y+p.h/2-sy)/tt,-170,170);
    addProj({own:'e',x:sx,y:sy,vx:e.face*330,vy,r:7,dmg:e.dmg,life:3,col:MAPS[G.mi].edge});sfx('shoot');
    e.st='walk';e.cd=rnd(1.8,2.6);
   }
  }
 }
 phys(e,dt,L);
 if(e.y>VH+100){e.dead=true;}
}

function updBoss(b,dt){
 const P=G.P,pc=P.x+P.w/2,bc=b.x+b.w/2,dx=pc-bc;
 b.anim+=dt;b.en=b.hp<b.maxHp*.35;b.cd-=dt;b.turnT-=dt;b.contactCd-=dt;b.sumCd-=dt;b.flash=Math.max(0,b.flash-dt);
 let n=0;for(const e of G.enemies)if(!e.dead&&e.owner===b)n++;b.minions=n;
 if(b.mech==='cycle'){b.cyT-=dt;if(b.cyT<=0){b.shieldOn=!b.shieldOn;b.cyT=b.shieldOn?4.5:4;sfx('click');}}
 if(b.mech==='exposed')b.vuln=Math.max(0,b.vuln-dt);
 if(b.st==='idle'){
  if(b.turnT<=0&&Math.abs(dx)>8){b.face=dx>0?1:-1;b.turnT=b.mech==='armor'?1.3:.4;}
  b.vx=Math.abs(dx)>150?b.face*b.spd:0;
  b.alpha=Math.min(1,b.alpha+dt*4);
  if(b.cd<=0&&!P.dead&&G.intro<=1.5)chooseMove(b);
 }else if(b.st==='wind'){
  b.vx*=.8;b.t0-=dt;
  if(b.mv==='teleport')b.alpha=Math.max(.15,b.alpha-dt*3);
  if(b.t0<=0){b.st='act';b.t0=BM[b.mv].act;if(BM[b.mv].start)BM[b.mv].start(b);}
 }else if(b.st==='act'){
  b.t0-=dt;const m=BM[b.mv];if(m.tick)m.tick(b,dt);
  if(b.t0<=0||b.actDone){if(m.end)m.end(b);b.st='rec';b.t0=m.rec;if(b.mech==='exposed')b.vuln=3.2;}
 }else if(b.st==='rec'){
  b.vx*=.85;b.t0-=dt;b.alpha=Math.min(1,b.alpha+dt*4);
  if(b.t0<=0){b.st='idle';b.cd=rnd(.7,1.4)*(b.en?.6:1)+(b.mech==='exposed'?1.5:0);}
 }
 if(b.contactCd<=0&&!P.dead&&ov(b,P)&&b.alpha>.5){if(hurtPlayer(b.dmg*.5,bc,1))b.contactCd=.8;}
 phys(b,dt,G.L);
}

/* ===== Cập nhật chung ===== */
function explode(pr){
 if(!pr.boom)return;
 addBox({own:pr.own,circ:1,cx:pr.x,cy:pr.y,r:pr.boomR||80,dmg:pr.boom,life:.15,kb:300,vis:'ring',col:pr.col});
 ring(pr.x,pr.y,pr.boomR||80,pr.col,.35);burst(pr.x,pr.y,pr.col,18,220,.5,3.5);addShake(4);sfx('boom');
}
function step(dt){
 const P=G.P,L=G.L;
 G.time+=dt;if(G.intro>0)G.intro-=dt;if(G.hintT>0)G.hintT-=dt;
 for(const pl of L.plats)if(pl.mov){const nx=pl.mx+Math.sin(G.time*pl.sp+pl.ph)*pl.range;pl.dx=nx-pl.x;pl.x=nx;}
 updPlayer(dt);
 for(let i=G.sched.length-1;i>=0;i--){const s=G.sched[i];s.t-=dt;if(s.t<=0){G.sched.splice(i,1);try{s.fn();}catch(e){}}}
 for(const e of G.enemies){
  if(e.dead)continue;
  e.flash=Math.max(0,e.flash-dt);e.cd-=dt;e.tm-=dt;e.stun=Math.max(0,e.stun-dt);e.kb=Math.max(0,e.kb-dt);e.show=Math.max(0,e.show-dt);e.orbCd=(e.orbCd||0)-dt;
  if(e.boss)updBoss(e,dt);else updMob(e,dt);
 }
 G.enemies=G.enemies.filter(e=>!e.dead||(G.bossRef===e));
 /* tháp pháo */
 for(let i=G.turrets.length-1;i>=0;i--){const t=G.turrets[i];t.t-=dt;t.cd-=dt;
  if(t.t<=0){G.turrets.splice(i,1);continue;}
  if(t.cd<=0){const e=nearestEnemy(t.x,560);if(e&&!e.dead){t.cd=.5;const ty=e.y+e.h/2-(t.y-24),tx=e.x+e.w/2-t.x,d=Math.hypot(tx,ty)||1;
   addProj({own:'p',x:t.x,y:t.y-24,vx:tx/d*640,vy:ty/d*640,r:7,dmg:t.dmg,life:1,col:t.col});sfx('shoot');}}}
 /* đạn */
 for(const pr of G.projs){
  pr.life-=dt;pr.vy+=pr.grav*dt;pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;
  if(pr.life<=0){explode(pr);pr.dead=true;continue;}
  if(pr.y>VH+60||pr.x<-120||pr.x>L.W+120){pr.dead=true;continue;}
  if(!pr.ign){let hit=false;for(const s of L.solids)if(pr.x>s.x&&pr.x<s.x+s.w&&pr.y>s.y&&pr.y<s.y+s.h){hit=true;break;}
   if(hit){explode(pr);burst(pr.x,pr.y,pr.col,5,120,.3,2);pr.dead=true;continue;}}
  if(pr.own==='p'){
   for(const e of G.enemies){
    if(e.dead||pr.hit.has(e)||!projHits(pr,e))continue;
    pr.hit.add(e);hitEnemy(e,pr.dmg,P.x+P.w/2,pr.y,pr);
    if(pr.pierce>0)pr.pierce--;else{explode(pr);pr.dead=true;break;}
   }
  }else if(!P.dead&&projHits(pr,P)){
   if(P.inv<=0||P.shield>0){hurtPlayer(pr.dmg,pr.x-sgn(pr.vx||1)*30,pr.kind==='wave'?1.2:.8);if(pr.kind!=='wave'){explode(pr);pr.dead=true;}}
  }
 }
 G.projs=G.projs.filter(p=>!p.dead);
 /* hộp sát thương */
 for(const b of G.boxes){
  b.life-=dt;
  if(b.follow){
   if(b.beam){const cx=P.x+P.w/2,cy=P.y+P.h/2;b.x=b.f>0?cx:cx-b.len;b.y=cy-b.bh/2;}
   else{b.x=P.x-(b.fw-P.w)/2;b.y=P.y-5;}
  }
  b.rt-=dt;if(b.rt<=0){b.hit.clear();b.rt=b.rehit;}
  if(b.own==='p'){
   for(const e of G.enemies){
    if(e.dead||b.hit.has(e)||!boxHits(b,e))continue;
    b.hit.add(e);
    const hy=b.circ?b.cy:b.y+b.h/2;
    hitEnemy(e,b.dmg,P.x+P.w/2,hy,b);
   }
  }else if(!P.dead&&!b.hit.has('p')&&boxHits(b,P)){
   if(hurtPlayer(b.dmg,b.circ?b.cx:b.x+b.w/2,b.kb||1))b.hit.add('p');
  }
 }
 G.boxes=G.boxes.filter(b=>b.life>0);
 /* vật phẩm hồi máu */
 for(const it of G.items){
  it.t+=dt;phys(it,dt,L);it.vx*=.96;
  if(it.y>VH+60||it.t>18)it.dead=true;
  else if(!P.dead&&ov(it,P)){it.dead=true;healPlayer(it.pct);sfx('pick');}
 }
 G.items=G.items.filter(i=>!i.dead);
 /* hạt, hiệu ứng, chữ */
 for(const p of G.parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;}
 G.parts=G.parts.filter(p=>p.life>0);
 for(const f of G.fx){f.life-=dt;f.r+=(f.r1-f.r)*Math.min(1,dt*10);}
 G.fx=G.fx.filter(f=>f.life>0);
 for(const t of G.texts){t.life-=dt;t.y-=40*dt;}
 G.texts=G.texts.filter(t=>t.life>0);
 for(const a of G.amb){a.ph+=dt;}
 G.shake=Math.max(0,G.shake-dt*30);
 /* camera */
 const tx=clamp(P.x+P.w/2-VW*.45,0,Math.max(0,L.W-VW));
 G.cam+=(tx-G.cam)*Math.min(1,dt*6);
 /* thắng / thua */
 if(G.over>0){G.over-=dt;if(G.over<=0)showOver();return;}
 if(!G.clear){let alive=0;for(const e of G.enemies)if(!e.dead)alive++;G.alive=alive;if(alive===0&&!P.dead){G.clear=2;sfx('win');}}
 else{G.clear-=dt;if(G.clear<=0)showWin();}
 for(const k in inp.q)inp.q[k]=false;
}

  case 1:for(let i=0;i<3;i++){c.beginPath();c.moveTo(-8+i*7,-6);c.lineTo(-5+i*7,-21-(i%2)*6);c.lineTo(-1+i*7,-6);c.fill();}break;
  case 2:c.fillStyle=c2;c.fillRect(-1,-5,11,5);c.strokeStyle=col;c.beginPath();c.moveTo(-4,-9);c.lineTo(-8,-20);c.lineTo(-2,-15);c.lineTo(-3,-24);c.stroke();break;
  case 3:for(let i=0;i<3;i++){c.beginPath();c.moveTo(-8+i*8,-7);c.lineTo(-5+i*8,-20-(i===1?4:0));c.lineTo(-2+i*8,-7);c.stroke();}break;
  case 4:c.beginPath();c.moveTo(-8,-6);c.quadraticCurveTo(-16,-14,-10,-22);c.moveTo(8,-6);c.quadraticCurveTo(16,-14,10,-22);c.stroke();break;
  case 5:c.fillStyle=c2;c.fillRect(-9,-2,18,5);c.strokeStyle=c2;c.beginPath();c.moveTo(-9,2);c.quadraticCurveTo(-24,6,-30,18);c.stroke();break;
  case 6:c.beginPath();c.moveTo(-8,-6);c.quadraticCurveTo(-4,-22,2,-12);c.quadraticCurveTo(6,-22,10,-8);c.stroke();break;
  case 7:c.strokeStyle=c2;c.beginPath();c.ellipse(0,-17,16,4,0,0,6.3);c.stroke();c.fillStyle=col;c.beginPath();c.arc(0,-17,3,0,6.3);c.fill();break;
  case 8:c.strokeStyle=c2;c.beginPath();for(let i=0;i<8;i++){const a=i/8*6.283,r=i%2?7:10;c.lineTo(Math.cos(a)*r,-14+Math.sin(a)*r);}c.closePath();c.stroke();break;
  case 9:c.strokeStyle=c2;c.beginPath();c.ellipse(0,-15,11,3.5,0,0,6.3);c.stroke();c.beginPath();c.moveTo(-8,8);c.lineTo(-24,0);c.lineTo(-14,14);c.stroke();break;

function drawWeapon(c,wp,hx,hy,ang,col,c2,t){
 const dx=Math.cos(ang),dy=Math.sin(ang);
 c.save();c.strokeStyle=c2;c.fillStyle=c2;c.lineWidth=3;
 const ln=L=>{c.beginPath();c.moveTo(hx,hy);c.lineTo(hx+dx*L,hy+dy*L);c.stroke();};
 switch(wp){
  case 'sword':c.strokeStyle=col;c.lineWidth=4;ln(34);c.strokeStyle=c2;c.lineWidth=2;ln(32);break;
  case 'spear':c.strokeStyle=c2;ln(52);c.fillStyle=col;c.beginPath();c.moveTo(hx+dx*52,hy+dy*52);c.lineTo(hx+dx*40-dy*5,hy+dy*40+dx*5);c.lineTo(hx+dx*40+dy*5,hy+dy*40-dx*5);c.fill();break;
  case 'staff':ln(38);c.fillStyle=col;c.beginPath();c.arc(hx+dx*40,hy+dy*40,5+Math.sin(t*8),0,6.3);c.fill();break;
  case 'gun':c.lineWidth=6;ln(16);c.strokeStyle=col;c.lineWidth=2;ln(18);break;
  case 'fist':c.fillStyle=col;c.beginPath();c.arc(hx+dx*3,hy+dy*3,6.5,0,6.3);c.fill();break;
  case 'dagger':c.strokeStyle=col;c.lineWidth=3;ln(16);break;
  case 'wand':ln(24);c.fillStyle=col;c.beginPath();c.arc(hx+dx*26,hy+dy*26,4,0,6.3);c.fill();break;
  case 'orb':c.fillStyle=col;c.beginPath();c.arc(hx+dx*10,hy+dy*10-2,6+Math.sin(t*6),0,6.3);c.fill();break;
  case 'wrench':ln(26);c.strokeStyle=col;c.lineWidth=5;c.beginPath();c.arc(hx+dx*28,hy+dy*28,5,0,6.3);c.stroke();break;
  case 'light':c.fillStyle='#fff';c.beginPath();c.arc(hx+dx*8,hy+dy*8,5,0,6.3);c.fill();c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.arc(hx+dx*8,hy+dy*8,9,0,6.3);c.stroke();break;
 }
 c.restore();
}
function drawHuman(c,cx,fy,face,o){

 c.save();c.translate(cx,fy);c.scale(face*sc,sc);c.lineCap='round';c.lineJoin='round';
 if(o.alpha!==undefined)c.globalAlpha=o.alpha;
 const col=o.flash?'#ffffff':o.col;
 if(o.glow){c.shadowColor=o.col;c.shadowBlur=o.glow;}
 c.strokeStyle=col;
 let a1=sw*9,a2=-sw*9;if(o.air){a1=7;a2=-5;}
 c.lineWidth=5;c.beginPath();c.moveTo(0,-24);c.lineTo(a1,-12);c.lineTo(a1+(o.air?-2:3),0);c.moveTo(0,-24);c.lineTo(a2,-12);c.lineTo(a2+(o.air?4:3),0);c.stroke();
 c.lineWidth=7;c.beginPath();c.moveTo(0,-24);c.lineTo(0,-42);c.stroke();
 c.lineWidth=4;c.beginPath();c.moveTo(0,-40);c.lineTo(-7-sw*4,-28);c.stroke();
 let ang=.75;const r=o.atk||0;
 if(o.melee){if(r>0)ang=-1.5+(1-r)*2.7;}
 else{ang=(r>0||o.cast>0)?-.05:.8;}
 const hx=Math.cos(ang)*14,hy=-40+Math.sin(ang)*14;
 c.lineWidth=4;c.beginPath();c.moveTo(0,-40);c.lineTo(hx,hy);c.stroke();

 if(o.shield){c.shadowBlur=0;c.strokeStyle='rgba(143,228,255,.9)';c.lineWidth=3;c.beginPath();c.arc(0,-28,40,0,6.3);c.stroke();c.fillStyle='rgba(143,228,255,.15)';c.fill();}
 c.restore();
}

function drawTerrain(c,L,M,cam,gl){
 for(const s of L.solids){
  if(s.x+s.w<cam-10||s.x>cam+VW+10)continue;
  const g=c.createLinearGradient(0,s.y,0,VH);g.addColorStop(0,M.ground);g.addColorStop(1,'#05050f');
  c.fillStyle=g;c.fillRect(s.x,s.y,s.w,s.h);
  c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=1;c.beginPath();
  for(let x=Math.ceil(s.x/40)*40;x<s.x+s.w;x+=40){c.moveTo(x,s.y+6);c.lineTo(x,VH);}
  for(let y=s.y+30;y<VH;y+=30){c.moveTo(Math.max(s.x,cam),y);c.lineTo(Math.min(s.x+s.w,cam+VW),y);}c.stroke();
  if(gl){c.shadowColor=M.edge;c.shadowBlur=gl;}
  c.strokeStyle=M.edge;c.lineWidth=3;c.beginPath();c.moveTo(s.x,s.y+1.5);c.lineTo(s.x+s.w,s.y+1.5);c.stroke();
  c.shadowBlur=0;
  c.beginPath();c.moveTo(s.x+1.5,s.y);c.lineTo(s.x+1.5,VH);c.moveTo(s.x+s.w-1.5,s.y);c.lineTo(s.x+s.w-1.5,VH);c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=2;c.stroke();
 }
 for(const p of L.plats){
  if(p.x+p.w<cam-10||p.x>cam+VW+10)continue;
  if(gl){c.shadowColor=M.acc;c.shadowBlur=gl;}
  c.fillStyle='rgba(10,8,30,.9)';c.fillRect(p.x,p.y,p.w,p.h);c.strokeStyle=M.acc;c.lineWidth=2.5;c.strokeRect(p.x,p.y,p.w,p.h);
  c.shadowBlur=0;
  if(p.mov){c.fillStyle=M.acc;c.fillRect(p.x+p.w/2-10,p.y+4,20,3);}
 }
 for(const s of L.springs){
  const a=s.a>0?s.a/.3:0;if(gl){c.shadowColor='#ffe600';c.shadowBlur=gl;}
  c.fillStyle='#ffe600';c.fillRect(s.x,s.y+4+a*4,s.w,8-a*4);c.strokeStyle='#ffe600';c.lineWidth=2;c.beginPath();c.moveTo(s.x+6,s.y+4+a*4);c.lineTo(s.x+14,s.y-4-a*8);c.lineTo(s.x+s.w-14,s.y+4);c.lineTo(s.x+s.w-6,s.y-4-a*8);c.stroke();c.shadowBlur=0;
 }
 for(const s of L.spikes){
  if(gl){c.shadowColor='#ff2b55';c.shadowBlur=gl;}
  c.fillStyle='#ff2b55';const n=Math.max(2,Math.round(s.w/18)),w=s.w/n;
  for(let i=0;i<n;i++){c.beginPath();c.moveTo(s.x+i*w,s.y+s.h);c.lineTo(s.x+i*w+w/2,s.y);c.lineTo(s.x+(i+1)*w,s.y+s.h);c.fill();}c.shadowBlur=0;
 }
}

 document.querySelectorAll('#touch .tb').forEach(el=>{
  const k=el.dataset.k;
  el.addEventListener('pointerdown',e=>{if(UI.edit)return;e.preventDefault();audioInit();cap(el,e.pointerId);inp.touch[k]=true;inp.q[k]=true;el.classList.add('act');});
  const up=e=>{if(UI.edit)return;inp.touch[k]=false;el.classList.remove('act');};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 });
 /* chế độ chỉnh vị trí nút */
 document.querySelectorAll('#touch .el').forEach(el=>{
  let drag=false;
  el.addEventListener('pointerdown',e=>{if(!UI.edit)return;e.preventDefault();drag=true;cap(el,e.pointerId);selectEl(el.dataset.id);});
  el.addEventListener('pointermove',e=>{if(!UI.edit||!drag)return;const l=S.set.layout[el.dataset.id];l.x=clamp(e.clientX/innerWidth*100,3,97);l.y=clamp(e.clientY/innerHeight*100,5,95);applyLayout();});
  const end=()=>{if(drag){drag=false;save();}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 });
}
function selectEl(id){
 editSel=id;document.querySelectorAll('#touch .el').forEach(el=>el.classList.toggle('pick',el.dataset.id===id));
 const sl=document.querySelector('#editbar [data-e="size"]');if(sl){sl.value=S.set.layout[id].s;sl.nextElementSibling.textContent='x'+S.set.layout[id].s.toFixed(2);}
 const nm=$('selname');if(nm)nm.textContent={joy:'Trục xoay',atk:'Đánh',jump:'Nhảy',s1:'Chiêu 1',s2:'Chiêu 2',s3:'Chiêu 3'}[id];
}

/* ===== Giao diện (menu, chọn nhân vật/map, cài đặt...) ===== */
const UI={map:0,from:'menu',listen:null,edit:false};
const uiEl=$('ui');
function ui(html,dim){uiEl.className=dim?'dim':'';uiEl.innerHTML=html;const p=uiEl.querySelector('.panel');if(p)p.scrollTop=0;}
function mapUnlocked(m){return m===0||S.prog[m-1]>=MAPS[m-1].stages;}
function fmtS(k,v){if(k==='lives')return String(v);if(k==='dropMob'||k==='dropBoss'||k==='healPct')return v+'%';if(k==='vol'||k==='opacity')return Math.round(v*100)+'%';return 'x'+(+v).toFixed(2).replace(/\.?0+$/,'');}
function slider(label,k,min,max,step){const v=S.set[k];return '<div class="sl"><span>'+label+'</span><input type="range" data-s="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'"><output>'+fmtS(k,v)+'</output></div>';}
function hideGameUI(){$('pauseBtn').style.display='none';$('muteBtn').style.display='none';setTouchVisible(false);}
function showMenu(){
 state='menu';hideGameUI();
 ui('<div class="panel" style="border-color:transparent;background:rgba(5,4,20,.55);box-shadow:none"><h1 class="title">NEON <span>ARENA</span></h1>'+
 '<p class="sub" style="font-size:clamp(13px,2.4vw,18px)">Đại chiến đối kháng 2D • 10 nhân vật • 10 map • 10 boss</p>'+
 '<p class="sub">🏆 Kỷ lục: <b style="color:#ffe600">'+S.high+'</b></p>'+
 '<div><button class="btn big" data-a="play">▶ CHƠI</button></div>'+
 '<div><button class="btn" data-a="help">📖 Hướng dẫn</button><button class="btn" data-a="settings" data-v="menu">⚙ Cài đặt</button></div>'+
 '<p class="sub" style="margin-top:12px">Đánh bại bot &amp; boss để qua màn, mở khóa map mới!</p></div>');
}
function showHelp(){
 ui('<div class="panel"><h2>HƯỚNG DẪN</h2><div class="two help"><div><h3>🖥 Máy tính</h3>'+
 '<b>←/→ hoặc A/D</b>: di chuyển<br><b>Space</b> (hoặc ↑/W): nhảy — nhấn lần 2 trên không để nhảy đôi<br><b>↓/S + Nhảy</b>: rơi xuống qua bệ mỏng<br>'+
 '<b>J</b>: đánh thường (giữ để đánh liên tục)<br><b>K / L / U</b>: chiêu 1 / 2 / 3<br><b>P</b> hoặc <b>Esc</b>: tạm dừng<br><i>Đổi phím trong Cài đặt.</i></div>'+
 '<div><h3>📱 Điện thoại</h3>Trục xoay bên trái để di chuyển, các nút bên phải: Đánh, Nhảy, Chiêu 1-3.<br>Vào <b>Cài đặt → Chỉnh vị trí nút</b> để kéo thả, đổi kích thước và độ mờ.</div></div>'+
 '<h3>🎯 Luật chơi</h3><div class="help">• Mỗi lần vào map bạn có số mạng mặc định (chỉnh được trước khi vào).<br>• Tiêu diệt toàn bộ địch trong màn để qua màn. Màn cuối của map là <b>BOSS</b>.<br>'+
 '• Né <b style="color:#ff2b55">gai đỏ</b>, dùng <b style="color:#ffe600">lò xo vàng</b> bật cao, bệ mỏng nhảy xuyên từ dưới lên. Rơi xuống vực mất 20% máu.<br>'+
 '• Địch rơi <b style="color:#5dff6a">❤ cục máu xanh</b> — nhặt để hồi máu.<br>• Mỗi boss có cách đánh bại riêng — đọc gợi ý hiện ra đầu màn!<br>• Qua hết các màn của map để mở khóa map tiếp theo.</div>'+
 '<div class="row"><button class="btn" data-a="menu">← Quay lại</button></div></div>');
}
function charDetail(i){
 const C=CHARS[i];
 return '<div><h2 style="color:'+C.c+'">'+C.n+'</h2><div class="sub">'+C.role+'</div>'+
 '<div class="sl" style="grid-template-columns:70px 1fr 40px"><span>Máu</span><div class="bar"><i style="width:'+(C.hp/420*100)+'%"></i></div><output>'+C.hp+'</output></div>'+
 '<div class="sl" style="grid-template-columns:70px 1fr 40px"><span>Sức mạnh</span><div class="bar"><i style="width:'+(C.atk/20*100)+'%"></i></div><output>'+C.atk+'</output></div>'+
 '<div class="sl" style="grid-template-columns:70px 1fr 40px"><span>Tốc độ</span><div class="bar"><i style="width:'+(C.spd/335*100)+'%"></i></div><output>'+C.spd+'</output></div>'+
 '<div class="skl"><b>Đánh thường</b> — '+(C.basic.k==='melee'?'cận chiến (tầm '+C.basic.rng+')':'tầm xa')+'</div>'+
 C.sk.map((s,k)=>'<div class="skl"><b>'+(k+1)+'. '+s.n+'</b> <span style="opacity:.7">(hồi '+s.cd+'s)</span><br>'+s.tip+'</div>').join('')+'</div>';
}
function showChars(){
 const cur=S.set.char;
 ui('<div class="panel"><h2>CHỌN NHÂN VẬT</h2><div class="two" style="grid-template-columns:1.5fr 1fr"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">'+
 CHARS.map((C,i)=>'<div class="card'+(i===cur?' sel':'')+'" data-a="char" data-v="'+i+'"><canvas data-pv="'+i+'" width="110" height="120"></canvas><div class="nm" style="color:'+C.c+'">'+C.n+'</div><div class="ds">'+C.role+'</div></div>').join('')+
 '</div>'+charDetail(cur)+'</div><div class="row"><button class="btn" data-a="menu">← Menu</button><button class="btn big" data-a="maps">Chọn map ▶</button></div></div>');
}
function showMaps(){
 ui('<div class="panel"><h2>CHỌN MAP</h2><div class="sub">Nhân vật: <b style="color:'+CHARS[S.set.char].c+'">'+CHARS[S.set.char].n+'</b> • Qua hết màn của map để mở khóa map tiếp theo</div><div class="grid">'+
 MAPS.map((M,i)=>{const un=mapUnlocked(i),done=S.prog[i]>=M.stages;
  return '<div class="card'+(un?'':' locked')+'" data-a="map" data-v="'+i+'" style="background:linear-gradient(180deg,'+M.sky[0]+','+M.sky[1]+' 60%,'+M.sky[2]+');border-color:'+(done?'#5dff6a':M.edge)+'">'+
  '<div style="font-size:30px">'+(un?(done?'✅':'🗺'):'🔒')+'</div><div class="nm">'+(i+1)+'. '+M.n+'</div><div class="ds" style="opacity:.95">Tiến độ: '+Math.min(S.prog[i],M.stages)+'/'+M.stages+' màn</div><div class="ds" style="opacity:.95">Boss: '+BOSSES[i].n+'</div></div>';}).join('')+
 '</div><div class="row"><button class="btn" data-a="play">← Đổi nhân vật</button><button class="btn" data-a="menu">Menu</button></div></div>');
}
function showPrep(){
 const m=UI.map,M=MAPS[m],B=BOSSES[m],done=S.prog[m];
 let st='';for(let s=0;s<M.stages;s++){const boss=s===M.stages-1;st+='<div class="stg'+(boss?' boss':'')+(s<done?' done':'')+(s>done?' lock':'')+'" data-a="stage" data-v="'+s+'" title="'+(boss?'Boss':'Màn '+(s+1))+'">'+(boss?'👑':s+1)+'</div>';}
 ui('<div class="panel"><h2 style="color:'+M.edge+'">'+(m+1)+'. '+M.n+'</h2>'+
 '<div class="sub">Địch: '+M.mob.join(' • ')+'<br>Boss: <b style="color:'+B.c+'">'+B.n+'</b> — <i>'+B.hint+'</i></div>'+
 '<h3>▶ Chọn màn để bắt đầu</h3><div>'+st+'</div>'+
 '<h3>Độ khó (điểm số nhân theo hệ số)</h3><div class="row">'+DIFFS.map((d,i)=>'<button class="btn'+(S.set.diff===i?' on':'')+'" data-a="diff" data-v="'+i+'">'+d.n+' x'+d.m+'</button>').join('')+'</div>'+
 '<h3>Tùy chỉnh trước khi vào map</h3><div class="two"><div>'+slider('Số mạng','lives',1,9,1)+slider('Hệ số máu của bạn','hpM',.5,5,.25)+slider('Sát thương đánh thường','dmgM',.5,5,.25)+slider('Sát thương chiêu','skM',.5,5,.25)+'</div>'+
 '<div>'+slider('Tỷ lệ rơi máu (bot)','dropMob',0,100,5)+slider('Tỷ lệ rơi máu (boss)','dropBoss',0,100,5)+slider('Hồi phục mỗi cục máu','healPct',5,100,5)+'</div></div>'+
 '<div class="row"><button class="btn" data-a="maps">← Chọn map</button></div></div>');
}
const KBL={left:'Sang trái',right:'Sang phải',down:'Xuống / rơi qua bệ',jump:'Nhảy',atk:'Đánh thường',s1:'Chiêu 1',s2:'Chiêu 2',s3:'Chiêu 3',pause:'Tạm dừng'};
function showSettings(){
 const s=S.set,gf=[['high','Cao'],['med','Trung bình'],['low','Thấp']],cm=[['auto','Tự động'],['pc','Máy tính'],['touch','Điện thoại']];
 ui('<div class="panel"><h2>CÀI ĐẶT</h2><div class="two"><div>'+
 '<h3>🔊 Âm thanh</h3><div class="row"><button class="btn sm'+(s.sound?' on':'')+'" data-a="sound">'+(s.sound?'Đang BẬT':'Đang TẮT')+'</button></div>'+slider('Âm lượng','vol',0,1,.05)+
 '<h3>🎨 Đồ họa</h3><div class="row">'+gf.map(g=>'<button class="btn sm'+(s.gfx===g[0]?' on':'')+'" data-a="gfx" data-v="'+g[0]+'">'+g[1]+'</button>').join('')+'</div>'+
 '<div class="sub">Cao: phát sáng neon + nhiều hạt • Thấp: mượt nhất cho máy yếu</div><div class="row"><button class="btn sm'+(s.shake?' on':'')+'" data-a="shake">Rung màn hình: '+(s.shake?'BẬT':'TẮT')+'</button></div>'+
 '<h3>🎮 Kiểu điều khiển</h3><div class="row">'+cm.map(g=>'<button class="btn sm'+(s.ctrl===g[0]?' on':'')+'" data-a="ctrl" data-v="'+g[0]+'">'+g[1]+'</button>').join('')+'</div>'+
 '<div class="row"><button class="btn sm" data-a="editlayout">📱 Chỉnh vị trí nút &amp; trục xoay</button></div>'+
 '<h3>🛠 Khác</h3><div class="row"><button class="btn sm" data-a="unlockall">Mở khóa tất cả map</button><button class="btn sm" data-a="resetprog">Xóa tiến độ</button></div></div>'+
 '<div><h3>⌨ Phím (bấm “Đổi” rồi nhấn phím mới)</h3>'+
 Object.keys(KBL).map(a=>'<div class="kb"><span>'+KBL[a]+'</span><span><kbd>'+(UI.listen===a?'Nhấn phím...':keyName(s.binds[a][0]))+'</kbd> <button class="btn sm" data-a="bind" data-v="'+a+'">Đổi</button></span></div>').join('')+
 '<div class="row"><button class="btn sm" data-a="resetbinds">Phím mặc định</button></div></div></div>'+
 '<div class="row"><button class="btn big" data-a="setback">← Quay lại</button></div></div>',UI.from==='pause');
}
function showPause(){state='pause';ui('<div class="panel"><h2>⏸ TẠM DỪNG</h2><div><button class="btn big" data-a="resume">▶ Tiếp tục</button></div><div><button class="btn" data-a="settings" data-v="pause">⚙ Cài đặt</button><button class="btn" data-a="retry">↻ Chơi lại màn</button><button class="btn" data-a="quit">⌂ Về menu</button></div></div>',true);}
function togglePause(){
 if(state==='play'){inp.keys.clear();for(const k in inp.touch)inp.touch[k]=false;inp.jx=inp.jy=0;showPause();}
 else if(state==='pause'){state='play';ui('',false);uiEl.className='hidden';lastT=performance.now();}
}
function showOver(){
 state='over';sfx('lose');if(G.score>S.high)S.high=G.score;save();hideGameUI();
 ui('<div class="panel"><h2 style="color:#ff4d6d;font-size:clamp(30px,6vw,56px)">GAME OVER</h2><div class="sub">Bạn đã hết mạng ở '+MAPS[G.mi].n+' — Màn '+(G.si+1)+'</div>'+
 '<div class="big-score">'+G.score+'</div><div class="sub">🏆 Kỷ lục: '+S.high+'</div>'+
 '<div class="row"><button class="btn big" data-a="retry">↻ Chơi lại</button></div><div class="row"><button class="btn" data-a="maps">Chọn map</button><button class="btn" data-a="menu">Menu</button></div></div>',true);
}
function showWin(){
 if(state!=='play')return;state='win';G.clear=-1;
 const M=MAPS[G.mi],bonus=G.lives*300;G.score+=bonus;
 const first=S.prog[G.mi]<=G.si;S.prog[G.mi]=Math.max(S.prog[G.mi],G.si+1);
 if(G.score>S.high)S.high=G.score;save();hideGameUI();
 const last=G.si===M.stages-1,mapDone=last,allDone=mapDone&&G.mi===9;
 let msg=last?(allDone?'🎉 BẠN ĐÃ PHÁ ĐẢO TOÀN BỘ GAME! 🎉':'🔓 Đã hoàn thành map! '+(G.mi<9?'Mở khóa: '+MAPS[G.mi+1].n:'')):'Màn '+(G.si+1)+' hoàn thành!';
 ui('<div class="panel"><h2 style="color:#5dff6a;font-size:clamp(28px,5vw,48px)">CHIẾN THẮNG!</h2><div class="sub">'+msg+'</div>'+
 '<div class="big-score">'+G.score+'</div><div class="sub">Thưởng mạng còn lại: +'+bonus+' • 🏆 Kỷ lục: '+S.high+'</div><div class="row">'+
 (last?'<button class="btn big" data-a="maps">Chọn map ▶</button>':'<button class="btn big" data-a="next">Màn tiếp theo ▶</button>')+
 '</div><div class="row"><button class="btn" data-a="retry">↻ Chơi lại màn</button><button class="btn" data-a="maps">Chọn map</button><button class="btn" data-a="menu">Menu</button></div></div>',true);
}
/* chỉnh vị trí nút */
function showEditor(){
 UI.edit=true;hideGameUI();uiEl.className='hidden';
 $('touch').style.display='block';$('touch').classList.add('edit');applyLayout();
 const eb=$('editbar');eb.style.display='block';
 eb.innerHTML='<div style="font-size:13px;margin-bottom:4px">Chạm nút để chọn • kéo để di chuyển. Đang chọn: <b id="selname" style="color:#ffe600">—</b></div>'+
 '<div class="sl"><span>Kích thước</span><input type="range" data-e="size" min=".5" max="2" step=".05" value="1"><output>x1</output></div>'+
 '<div class="sl"><span>Độ mờ</span><input type="range" data-s="opacity" min=".3" max="1" step=".05" value="'+S.set.opacity+'"><output>'+fmtS('opacity',S.set.opacity)+'</output></div>'+
 '<button class="btn sm" data-a="resetlayout">Đặt lại</button><button class="btn sm on" data-a="doneedit">Xong</button>';
 selectEl('atk');
}
function endEditor(){UI.edit=false;$('touch').classList.remove('edit');$('touch').style.display='none';$('editbar').style.display='none';save();showSettings();}

/* ===== Xử lý thao tác UI ===== */
function act(a,v){
 sfx('click');audioInit();
 switch(a){
  case 'play':showChars();break;
  case 'help':showHelp();break;
  case 'menu':case 'quit':state='menu';G=G;hideGameUI();showMenu();break;
  case 'char':S.set.char=+v;save();showChars();break;
  case 'maps':showMaps();break;
  case 'map':UI.map=+v;showPrep();break;
  case 'diff':S.set.diff=+v;save();showPrep();break;
  case 'stage':startStage(UI.map,+v,null);break;
  case 'settings':UI.from=v||'menu';showSettings();break;
  case 'setback':UI.listen=null;if(UI.from==='pause')showPause();else showMenu();break;
  case 'sound':S.set.sound=!S.set.sound;setVol();save();$('muteBtn').textContent=S.set.sound?'🔊':'🔇';showSettings();break;
  case 'gfx':S.set.gfx=v;save();resize();showSettings();break;
  case 'shake':S.set.shake=!S.set.shake;save();showSettings();break;
  case 'ctrl':S.set.ctrl=v;save();showSettings();break;
  case 'bind':UI.listen=v;showSettings();break;
  case 'resetbinds':S.set.binds=JSON.parse(JSON.stringify(DEFSET.binds));save();showSettings();break;
  case 'editlayout':showEditor();break;
  case 'resetlayout':S.set.layout=JSON.parse(JSON.stringify(DEFSET.layout));save();applyLayout();selectEl(editSel||'atk');break;
  case 'doneedit':endEditor();break;
  case 'unlockall':for(let i=0;i<10;i++)S.prog[i]=MAPS[i].stages;save();showSettings();break;
  case 'resetprog':if(confirm('Xóa toàn bộ tiến độ và kỷ lục?')){S.prog=Array(10).fill(0);S.high=0;save();}showSettings();break;
  case 'resume':togglePause();break;
  case 'retry':{const g=G;startStage(g.mi,g.si,{score:g.startScore,lives:S.set.lives});break;}
  case 'next':{const g=G;startStage(g.mi,g.si+1,{score:g.score,lives:g.lives});break;}
 }
}
uiEl.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset.v);});
document.addEventListener('click',e=>{const t=e.target.closest('#editbar [data-a]');if(t)act(t.dataset.a,t.dataset.v);});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.s){const k=t.dataset.s,v=parseFloat(t.value);S.set[k]=v;t.nextElementSibling.textContent=fmtS(k,v);if(k==='vol')setVol();if(k==='opacity')applyLayout();save();}
 else if(t.dataset&&t.dataset.e==='size'&&editSel){const l=S.set.layout[editSel];l.s=parseFloat(t.value);t.nextElementSibling.textContent='x'+l.s.toFixed(2);applyLayout();save();}
});
$('pauseBtn').addEventListener('click',()=>{if(state==='play'||state==='pause')togglePause();});
$('muteBtn').addEventListener('click',e=>{audioInit();S.set.sound=!S.set.sound;setVol();save();e.target.textContent=S.set.sound?'🔊':'🔇';});
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>audioInit(),{once:true});

/* ===== Khởi động ===== */
initTouch();resize();$('muteBtn').textContent=S.set.sound?'🔊':'🔇';
showMenu();requestAnimationFrame(loop);

</script>
